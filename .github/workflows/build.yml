name: Build Safe GP2040-CE Pico Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets and generate fsdata.c
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/httpd/fsdata.c
          echo "Found lib/httpd/fsdata.c"
          wc -c lib/httpd/fsdata.c

      - name: Configure official Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build official Pico UF2
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Find generated UF2
        id: find-uf2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE=$(find gp2040-ce/build -type f -name '*.uf2' | head -n 1)

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated. Generated files:"
            find gp2040-ce/build -type f | sort
            exit 1
          fi

          echo "UF2_FILE=$UF2_FILE"
          echo "uf2_file=$UF2_FILE" >> "$GITHUB_OUTPUT"

          cp "$UF2_FILE" GP2040-CE-Pico-safe.uf2
          sha256sum GP2040-CE-Pico-safe.uf2 | tee SHA256SUMS.txt

      - name: Upload safe UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-safe
          path: |
            GP2040-CE-Pico-safe.uf2
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish safe GitHub release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="safe-pico-${GITHUB_RUN_NUMBER}"

          gh release create "$RELEASE_TAG" \
            GP2040-CE-Pico-safe.uf2 \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Safe GP2040-CE Pico v0.7.12" \
            --notes "Official GP2040-CE v0.7.12 Pico build. No runtime BOOTSEL or QSPI modification was applied. GP6 uses the standard GP2040-CE macro input behavior."
        env:
          GH_TOKEN: ${{ github.token }}
