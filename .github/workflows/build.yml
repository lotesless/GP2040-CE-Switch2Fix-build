name: Build GP2040-CE v0.7.12 Switch 2 Fix Auto A

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Apply stable Switch 2 fix and automatic A
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          macro_file = Path("src/addons/input_macro.cpp")
          macro_source = macro_file.read_text()

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          gpio_include = '#include "hardware/gpio.h"'

          if gpio_include not in macro_source:
              raise SystemExit(
                  "Cannot find hardware/gpio.h include"
              )

          for include_line in required_includes:
              if include_line not in macro_source:
                  macro_source = macro_source.replace(
                      gpio_include,
                      gpio_include +
                      "\n" +
                      include_line,
                      1,
                  )

          available_marker = (
              "bool InputMacro::available() {"
          )

          if available_marker not in macro_source:
              raise SystemExit(
                  "InputMacro::available marker not found"
              )

          helper_marker = (
              "namespace Switch2FixSupport"
          )

          helper_code = r'''
          namespace Switch2FixSupport {

          constexpr uint64_t BOOTSEL_START_DELAY_US =
              1000000;

          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              20000;

          constexpr uint64_t BOOTSEL_DEBOUNCE_US =
              30000;

          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;

          constexpr uint64_t AUTO_A_START_DELAY_US =
              1000000;

          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          constexpr int AUTO_A_PRESS_COUNT = 3;

          uint64_t bootselStartTime = 0;
          uint64_t bootselLastPollTime = 0;
          uint64_t bootselChangedTime = 0;

          bool bootselRawState = false;
          bool bootselStableState = false;
          bool bootselEdgeState = false;

          int selectedMacro =
              MACRO_6_INDEX;

          uint64_t autoAStartTime = 0;
          int autoAPressCount = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              // BOOTSEL temporarily disables flash access.
              // Interrupts must remain disabled during
              // the complete QSPI read sequence.
              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              // Do not call sleep functions here.
              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              // BOOTSEL is active low.
              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void resetBootselState() {
              bootselStartTime = 0;
              bootselLastPollTime = 0;
              bootselChangedTime = 0;

              bootselRawState = false;
              bootselStableState = false;
              bootselEdgeState = false;

              selectedMacro =
                  MACRO_6_INDEX;
          }

          void updateBootselMacroSelector() {
              uint64_t now = getMicro();

              if (bootselStartTime == 0) {
                  bootselStartTime = now;
                  bootselChangedTime = now;
                  return;
              }

              // Do not read BOOTSEL immediately after
              // firmware startup. This is important for
              // stable Switch 2 USB initialization.
              if (
                  now - bootselStartTime <
                  BOOTSEL_START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - bootselLastPollTime <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollTime = now;

              bool rawState =
                  readBootselButton();

              if (rawState != bootselRawState) {
                  bootselRawState = rawState;
                  bootselChangedTime = now;
              }

              if (
                  now - bootselChangedTime >=
                      BOOTSEL_DEBOUNCE_US &&
                  rawState != bootselStableState
              ) {
                  bootselStableState = rawState;

                  // Switch the macro on the BOOTSEL
                  // press edge, not on release.
                  //
                  // This preserves the behavior of
                  // the early working Switch 2 version.
                  if (
                      bootselStableState &&
                      !bootselEdgeState
                  ) {
                      selectedMacro =
                          selectedMacro ==
                              MACRO_6_INDEX
                              ? MACRO_2_INDEX
                              : MACRO_6_INDEX;
                  }

                  bootselEdgeState =
                      bootselStableState;
              }
          }

          void resetAutomaticASequence() {
              autoAStartTime = 0;
              autoAPressCount = 0;
          }

          void runAutomaticASequence(
              Gamepad* gamepad
          ) {
              uint64_t now = getMicro();

              if (autoAStartTime == 0) {
                  autoAStartTime = now;
                  return;
              }

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  return;
              }

              uint64_t elapsed =
                  now - autoAStartTime;

              uint64_t pressStart =
                  AUTO_A_START_DELAY_US +
                  (
                      static_cast<uint64_t>(
                          autoAPressCount
                      ) *
                      AUTO_A_INTERVAL_US
                  );

              uint64_t pressEnd =
                  pressStart +
                  AUTO_A_HOLD_US;

              if (
                  elapsed >= pressStart &&
                  elapsed < pressEnd
              ) {
                  // B1 is the primary face button
                  // and is normally reported as A
                  // in Nintendo Switch mode.
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B1;
              }

              if (elapsed >= pressEnd) {
                  autoAPressCount++;
              }
          }

          }
          '''

          if helper_marker not in macro_source:
              macro_source = macro_source.replace(
                  available_marker,
                  helper_code.strip() +
                  "\n\n" +
                  available_marker,
                  1,
              )

          old_trigger_block = '''    // Go through our macro list
          pressedMacro = -1;
          for(int i = 0; i < MAX_MACRO_LIMIT; i++) {'''

          new_trigger_block = '''    updateBootselMacroSelector();

          // BOOTSEL selects Macro 6 or Macro 2.
          //
          // The official macro pin configuration is
          // retained. The selected macro is injected
          // into the normal InputMacro path.
          if (
              macroPinMasks[MACRO_2_INDEX] &&
              macroPinMasks[MACRO_6_INDEX] &&
              (
                  allPins &
                  macroPinMasks[MACRO_2_INDEX]
              )
          ) {
              pressedMacro =
                  selectedMacro;

              return;
          }

          // Go through our macro list
          pressedMacro = -1;
          for(int i = 0; i < MAX_MACRO_LIMIT; i++) {'''

          if old_trigger_block not in macro_source:
              raise SystemExit(
                  "InputMacro trigger block not found"
              )

          macro_source = macro_source.replace(
              old_trigger_block,
              new_trigger_block,
              1,
          )

          preprocess_marker = (
              "void InputMacro::preprocess()\n{"
          )

          if preprocess_marker not in macro_source:
              preprocess_marker = (
                  "void InputMacro::preprocess()\r\n{"
              )

          if preprocess_marker not in macro_source:
              raise SystemExit(
                  "InputMacro::preprocess marker not found"
              )

          auto_a_call = '''
          {
              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              Switch2FixSupport::runAutomaticASequence(
                  gamepad
              );
          }

          '''

          macro_source = macro_source.replace(
              preprocess_marker,
              preprocess_marker +
              auto_a_call,
              1,
          )

          macro_file.write_text(macro_source)

          # Disable the original BOOTSEL addon.
          #
          # The custom BOOTSEL selector above is deliberately
          # located in input_macro.cpp because the early
          # Switch 2 Fix version used this architecture and
          # was able to enumerate on Switch 2.
          bootsel_file = Path(
              "src/addons/bootsel_button.cpp"
          )

          bootsel_file.write_text(
              '#include "addons/bootsel_button.h"\n\n'
              'bool BootselButtonAddon::available() '
              '{ return false; }\n'
              'void BootselButtonAddon::setup() {}\n'
              'void BootselButtonAddon::preprocess() {}\n'
          )

          print(
              "Stable early Switch 2 architecture installed"
          )
          print(
              "Original BOOTSEL addon disabled"
          )
          print(
              "BOOTSEL polling starts after one second"
          )
          print(
              "BOOTSEL polling interval: 20 ms"
          )
          print(
              "BOOTSEL debounce: 30 ms"
          )
          print(
              "Automatic A sequence added"
          )
          print(
              "Automatic A count: 3"
          )
          print(
              "Automatic A interval: 500 ms"
          )
          PY

      - name: Verify Switch 2 fix source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/input_macro.cpp
          test -f src/addons/bootsel_button.cpp

          grep -q \
            "namespace Switch2FixSupport" \
            src/addons/input_macro.cpp

          grep -q \
            "readBootselButton" \
            src/addons/input_macro.cpp

          grep -q \
            "updateBootselMacroSelector" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_PRESS_COUNT" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_INTERVAL_US" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_HOLD_US" \
            src/addons/input_macro.cpp

          grep -q \
            "GAMEPAD_MASK_B1" \
            src/addons/input_macro.cpp

          grep -q \
            "InputMacro::runCurrentMacro" \
            src/addons/input_macro.cpp

          grep -q \
            "return false" \
            src/addons/bootsel_button.cpp

          if grep -q \
            "BootselMacroBridge" \
            src/addons/bootsel_button.cpp; then
            echo "Unexpected old BOOTSEL bridge remains"
            exit 1
          fi

          if grep -q \
            "readBootselForMacro" \
            src/addons/bootsel_button.cpp; then
            echo "Unexpected old BOOTSEL reader remains"
            exit 1
          fi

          echo "Switch 2 fix source verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico UF2
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated Pico UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -maxdepth 2 \
              -type f \
              -name "GP2040-CE_*_Pico.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
              UF2_FILE="$(
                find gp2040-ce/build \
                  -maxdepth 3 \
                  -type f \
                  -name "*.uf2" \
                  | head -n 1
              )"
          fi

          if [ -z "$UF2_FILE" ]; then
            echo "Pico UF2 file was not generated"

            find gp2040-ce/build \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1
          fi

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Generated UF2:"
          echo "$UF2_FILE"

      - name: Package UF2 and checksum
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2

          sha256sum \
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2 \
            > SHA256SUMS.txt

          echo "Packaged firmware:"
          ls -lh \
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2 \
            SHA256SUMS.txt

      - name: Upload Switch 2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-v0.7.12-Switch2-Fix-AutoA
          path: |
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
