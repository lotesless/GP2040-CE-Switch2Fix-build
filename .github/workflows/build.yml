name: Build GP2040-CE Pico BOOTSEL Macro Switch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CI=false npm run build

      - name: Verify web filesystem source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/httpd/fsdata.c
          echo "Found lib/httpd/fsdata.c"

      - name: Apply safe BOOTSEL macro switch
        working-directory: gp2040-ce
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/addons/input_macro.cpp")
          source = path.read_text()

          # These headers are used by the RP2040 safe BOOTSEL reader.
          anchor = '#include "hardware/gpio.h"'
          headers = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          if anchor not in source:
              raise SystemExit("Cannot find hardware/gpio.h include")

          for header in headers:
              if header not in source:
                  source = source.replace(anchor, anchor + "\\n" + header, 1)

          helper_marker = "bool InputMacro::available() {"

          helper = r'''namespace {
          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;
          constexpr uint64_t BOOTSEL_START_DELAY_US = 1000000;
          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US = 50000;
          constexpr uint64_t BOOTSEL_DEBOUNCE_US = 30000;

          uint64_t bootselStartedAt = 0;
          uint64_t bootselLastPoll = 0;
          uint64_t bootselChangedAt = 0;
          bool bootselRawPressed = false;
          bool bootselStablePressed = false;
          bool bootselPreviousStablePressed = false;
          int selectedMacro = MACRO_6_INDEX;
          int previousSelectedMacro = MACRO_6_INDEX;

          // This function must run entirely from SRAM because the RP2040
          // QSPI CS line is temporarily overridden while BOOTSEL is read.
          bool __no_inline_not_in_flash_func(readBootselSafely)() {
              const uint CS_PIN_INDEX = 1;
              uint32_t flags = save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              bool pressed = !(sio_hw->gpio_hi_in & (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);
              return pressed;
          }

          void updateBootselSelector() {
              uint64_t now = getMicro();

              if (bootselStartedAt == 0) {
                  bootselStartedAt = now;
                  return;
              }

              // Never touch QSPI during the first second after USB startup.
              if (now - bootselStartedAt < BOOTSEL_START_DELAY_US) {
                  return;
              }

              if (now - bootselLastPoll < BOOTSEL_POLL_INTERVAL_US) {
                  return;
              }

              bootselLastPoll = now;
              bool raw = readBootselSafely();

              if (raw != bootselRawPressed) {
                  bootselRawPressed = raw;
                  bootselChangedAt = now;
              }

              if (now - bootselChangedAt >= BOOTSEL_DEBOUNCE_US &&
                  bootselRawPressed != bootselStablePressed) {
                  bootselStablePressed = bootselRawPressed;

                  // Toggle only on the stable press edge.
                  if (bootselStablePressed && !bootselPreviousStablePressed) {
                      selectedMacro =
                          selectedMacro == MACRO_6_INDEX
                              ? MACRO_2_INDEX
                              : MACRO_6_INDEX;
                  }

                  bootselPreviousStablePressed = bootselStablePressed;
              }
          }
          }
          '''

          if helper_marker not in source:
              raise SystemExit("Cannot find InputMacro::available marker")

          if "readBootselSafely" not in source:
              source = source.replace(helper_marker, helper + "\\n" + helper_marker, 1)

          start_marker = "void InputMacro::checkMacroPress() {"
          end_marker = "void InputMacro::checkMacroAction() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Cannot locate macro check functions")

          new_check_press = r'''void InputMacro::checkMacroPress() {
              updateBootselSelector();

              Gamepad * gamepad = Storage::getInstance().GetGamepad();
              Mask_t allPins = gamepad->debouncedGpio;

              pressedMacro = -1;

              // GP6 must be configured as Macro 6 in Pin Mapping.
              // Internally it is used as a shared trigger for Macro 2/6.
              if (macroPinMasks[MACRO_6_INDEX] &&
                  (allPins & macroPinMasks[MACRO_6_INDEX])) {
                  pressedMacro = selectedMacro;
                  return;
              }

              // Preserve the official GP2040-CE behavior for all other
              // configured macro inputs.
              for (int i = 0; i < MAX_MACRO_LIMIT; i++) {
                  if (!inputMacroOptions->macroList[i].enabled)
                      continue;

                  Macro * macro = &inputMacroOptions->macroList[i];

                  if (macro->useMacroTriggerButton) {
                      if ((allPins & macroButtonMask) &&
                          ((gamepad->state.buttons & macro->macroTriggerButton) ||
                           (gamepad->state.dpad &
                            (macro->macroTriggerButton >> 16)))) {
                          pressedMacro = i;
                          break;
                      }
                  } else if (allPins & macroPinMasks[i]) {
                      pressedMacro = i;
                      break;
                  }
              }
          }

          '''

          source = source[:start] + new_check_press + source[end:]

          # Guard against the official v0.7.12 code indexing macroList[-1]
          # when no macro input is currently pressed.
          action_marker = "void InputMacro::checkMacroAction() {"
          guard_marker = "    bool macroInputPressed = (pressedMacro != -1);"
          guard = '''    bool macroInputPressed = (pressedMacro != -1);

              if (pressedMacro == -1) {
                  prevMacroInputPressed = false;
                  return;
              }'''

          if guard_marker not in source:
              raise SystemExit("Cannot find macro action guard location")

          source = source.replace(guard_marker, guard, 1)
          path.write_text(source)

          print("Safe BOOTSEL macro switch patch applied")
          print("GP6 is the shared trigger; BOOTSEL selects Macro 2 or Macro 6")
          PY

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/pico-sdk"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico UF2
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Find and verify UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE=$(find gp2040-ce/build -type f -name '*.uf2' | head -n 1)

          if [ -z "$UF2_FILE" ]; then
              echo "No UF2 file found"
              find gp2040-ce/build -type f | sort
              exit 1
          fi

          cp "$UF2_FILE" GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2
          sha256sum GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2 | tee SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-BOOTSEL-MacroSwitch
          path: |
            GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="bootsel-macro-switch-${GITHUB_RUN_NUMBER}"

          gh release create "$RELEASE_TAG" \
            GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2 \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "GP2040-CE Pico BOOTSEL Macro Switch" \
            --notes "GP2040-CE v0.7.12 Pico build. GP6 is the shared macro trigger. The onboard BOOTSEL button safely toggles GP6 between Macro 2 and Macro 6 after startup." 
        env:
          GH_TOKEN: ${{ github.token }}
