name: Build GP2040-CE Switch 2 Four A Direct Macro Start

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK verified:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Generated web filesystem verified:"
          ls -lh lib/httpd/fsdata.c

      - name: Apply direct macro start patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          macro_file = Path(
              "src/addons/input_macro.cpp"
          )

          bootsel_file = Path(
              "src/addons/bootsel_button.cpp"
          )

          if not macro_file.is_file():
              raise SystemExit(
                  "src/addons/input_macro.cpp was not found"
              )

          if not bootsel_file.is_file():
              raise SystemExit(
                  "src/addons/bootsel_button.cpp was not found"
              )

          source = macro_file.read_text(
              encoding="utf-8"
          )

          source = source.replace(
              "\r\n",
              "\n",
          ).replace(
              "\r",
              "\n",
          )

          if "namespace Switch2FixSupport" in source:
              raise SystemExit(
                  "Switch2FixSupport was already inserted"
              )

          def find_function_span(
              text,
              function_name,
          ):
              pattern = re.compile(
                  r"^[ \t]*"
                  r"(?:bool|void|int|uint|uint32_t|"
                  r"uint64_t|std::string)"
                  r"[ \t]+"
                  + re.escape(function_name)
                  + r"[ \t]*"
                  r"$[ \t\r\n]*$",
                  re.MULTILINE,
              )

              matches = list(
                  pattern.finditer(text)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "Expected exactly one "
                      + function_name
                      + ", found "
                      + str(len(matches))
                  )

              match = matches[0]

              opening_brace = text.find(
                  "{",
                  match.end(),
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Opening brace for "
                      + function_name
                      + " was not found"
                  )

              depth = 0
              closing_brace = -1

              for position in range(
                  opening_brace,
                  len(text),
              ):
                  character = text[position]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          closing_brace = position
                          break

              if closing_brace < 0:
                  raise SystemExit(
                      "Closing brace for "
                      + function_name
                      + " was not found"
                  )

              return (
                  match.start(),
                  closing_brace + 1,
              )

          def replace_function(
              text,
              function_name,
              replacement,
          ):
              start, end = find_function_span(
                  text,
                  function_name,
              )

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          gpio_include = (
              '#include "hardware/gpio.h"'
          )

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "tusb.h"',
          ]

          if gpio_include not in source:
              raise SystemExit(
                  "hardware/gpio.h was not found"
              )

          missing_includes = [
              item
              for item in required_includes
              if item not in source
          ]

          if missing_includes:
              source = source.replace(
                  gpio_include,
                  (
                      gpio_include
                      + "\n"
                      + "\n".join(missing_includes)
                  ),
                  1,
              )

          source = replace_function(
              source,
              "InputMacro::available",
              r'''
          bool InputMacro::available() {
              // Keep InputMacro active even when no
              // physical macro button is being pressed.
              return true;
          }
          ''',
          )

          setup_start, _ = find_function_span(
              source,
              "InputMacro::setup",
          )

          helper_code = r'''
          namespace Switch2FixSupport {

          enum class SequenceStage {
              WAITING_FOR_USB,
              AUTO_A,
              MACRO_SELECTION,
              START_MACRO,
              MACRO_RUNNING
          };

          // Fixed user configuration:
          // GP6 -> Macro 2 -> zero-based index 1.
          // GP7 -> Macro 6 -> zero-based index 5.
          constexpr int GP6_MACRO_INDEX = 1;
          constexpr int GP7_MACRO_INDEX = 5;

          constexpr uint GP6_PIN = 6;
          constexpr uint GP7_PIN = 7;

          // Delay after USB mounting before the first A.
          constexpr uint64_t USB_SETTLE_DELAY_US =
              2000000;

          constexpr int AUTO_A_PRESS_COUNT = 4;

          // Start-to-start interval.
          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          // The ten-second selection window starts
          // after the fourth A is released.
          constexpr uint64_t MACRO_SELECTION_WINDOW_US =
              10000000;

          // BOOTSEL is read only after the USB connection
          // has settled and while selection or macro
          // switching is active.
          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              5000;

          constexpr uint64_t BOOTSEL_DEBOUNCE_US =
              30000;

          SequenceStage stage =
              SequenceStage::WAITING_FOR_USB;

          bool usbWasMounted = false;
          uint64_t usbMountedAt = 0;

          int autoAPressCount = 0;
          bool autoAIsPressed = false;
          uint64_t autoAPressStartedAt = 0;
          uint64_t nextAutoAPressAt = 0;

          uint64_t selectionEndsAt = 0;

          // false means GP6 / Macro 2.
          // true means GP7 / Macro 6.
          bool useGp7Macro = false;

          // This request remains true until the selected
          // macro is actually initialized and running.
          bool macroStartRequest = false;

          // BOOTSEL edge detector.
          bool bootselRawPressed = false;
          bool bootselStablePressed = false;
          uint64_t bootselChangedAt = 0;
          uint64_t bootselLastPollAt = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (
                  volatile int delay = 0;
                  delay < 1000;
                  ++delay
              ) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void resetSession() {
              stage =
                  SequenceStage::WAITING_FOR_USB;

              usbMountedAt = 0;

              autoAPressCount = 0;
              autoAIsPressed = false;
              autoAPressStartedAt = 0;
              nextAutoAPressAt = 0;

              selectionEndsAt = 0;

              useGp7Macro = false;
              macroStartRequest = false;

              bootselRawPressed = false;
              bootselStablePressed = false;
              bootselChangedAt = 0;
              bootselLastPollAt = 0;
          }

          void requestMacroStart() {
              macroStartRequest = true;
              stage =
                  SequenceStage::START_MACRO;
          }

          void updateUsbConnection() {
              bool mounted = tud_mounted();
              uint64_t now = getMicro();

              if (!mounted) {
                  if (usbWasMounted) {
                      resetSession();
                  }

                  usbWasMounted = false;
                  return;
              }

              if (!usbWasMounted) {
                  resetSession();

                  usbWasMounted = true;
                  usbMountedAt = now;

                  nextAutoAPressAt =
                      now +
                      USB_SETTLE_DELAY_US;

                  stage =
                      SequenceStage::AUTO_A;
              }
          }

          void updateBootselEdges() {
              if (
                  stage !=
                      SequenceStage::MACRO_SELECTION &&
                  stage !=
                      SequenceStage::START_MACRO &&
                  stage !=
                      SequenceStage::MACRO_RUNNING
              ) {
                  return;
              }

              uint64_t now = getMicro();

              if (
                  now - bootselLastPollAt <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollAt = now;

              bool rawPressed =
                  readBootselButton();

              if (
                  rawPressed !=
                  bootselRawPressed
              ) {
                  bootselRawPressed =
                      rawPressed;

                  bootselChangedAt = now;
              }

              if (
                  rawPressed ==
                      bootselStablePressed
              ) {
                  return;
              }

              if (
                  now - bootselChangedAt <
                  BOOTSEL_DEBOUNCE_US
              ) {
                  return;
              }

              bool oldStableState =
                  bootselStablePressed;

              bootselStablePressed =
                  rawPressed;

              // Only a stable released-to-pressed
              // transition creates a new BOOTSEL action.
              if (
                  oldStableState ||
                  !bootselStablePressed
              ) {
                  return;
              }

              if (
                  stage ==
                  SequenceStage::MACRO_SELECTION
              ) {
                  // During the initial ten-second window,
                  // BOOTSEL chooses GP7 instead of GP6.
                  useGp7Macro = true;
                  return;
              }

              if (
                  stage ==
                      SequenceStage::START_MACRO ||
                  stage ==
                      SequenceStage::MACRO_RUNNING
              ) {
                  // After startup, every new press toggles
                  // GP6 Macro 2 and GP7 Macro 6.
                  useGp7Macro = !useGp7Macro;

                  // Keep the request active until the
                  // selected macro really starts.
                  requestMacroStart();
              }
          }

          void updateAutomaticA() {
              if (
                  stage !=
                  SequenceStage::AUTO_A
              ) {
                  return;
              }

              uint64_t now = getMicro();

              if (
                  !autoAIsPressed &&
                  autoAPressCount <
                      AUTO_A_PRESS_COUNT &&
                  now >= nextAutoAPressAt
              ) {
                  autoAIsPressed = true;
                  autoAPressStartedAt = now;
              }

              if (!autoAIsPressed) {
                  return;
              }

              if (
                  now - autoAPressStartedAt <
                  AUTO_A_HOLD_US
              ) {
                  return;
              }

              autoAIsPressed = false;
              ++autoAPressCount;

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  selectionEndsAt =
                      now +
                      MACRO_SELECTION_WINDOW_US;

                  // Default is always GP6 after the
                  // automatic A sequence.
                  useGp7Macro = false;

                  // Start the selection window with a
                  // clean BOOTSEL released state.
                  bootselRawPressed = false;
                  bootselStablePressed = false;
                  bootselChangedAt = now;
                  bootselLastPollAt = 0;

                  stage =
                      SequenceStage::
                          MACRO_SELECTION;

                  return;
              }

              // Keep 500 ms from one press start to the
              // next press start.
              nextAutoAPressAt =
                  autoAPressStartedAt +
                  AUTO_A_INTERVAL_US;
          }

          void updateSequence() {
              updateUsbConnection();

              if (!usbWasMounted) {
                  return;
              }

              updateAutomaticA();
              updateBootselEdges();

              if (
                  stage ==
                  SequenceStage::MACRO_SELECTION
              ) {
                  if (
                      getMicro() >=
                      selectionEndsAt
                  ) {
                      // The request remains active until
                      // checkMacroAction confirms startup.
                      requestMacroStart();
                  }
              }
          }

          void applyAutomaticA(
              Gamepad* gamepad
          ) {
              if (
                  stage ==
                      SequenceStage::AUTO_A &&
                  autoAIsPressed
              ) {
                  // GP2040-CE SwitchProDriver mapping:
                  // B1 -> Switch B.
                  // B2 -> Switch A.
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B2;
              }
          }

          bool isMacroStartRequested() {
              return macroStartRequest;
          }

          void markMacroStarted() {
              // This is the only point where a start request
              // is cleared.
              macroStartRequest = false;

              stage =
                  SequenceStage::MACRO_RUNNING;
          }

          int getSelectedMacroIndex() {
              return useGp7Macro
                  ? GP7_MACRO_INDEX
                  : GP6_MACRO_INDEX;
          }

          }
          '''

          source = (
              source[:setup_start]
              + helper_code.strip()
              + "\n\n"
              + source[setup_start:]
          )

          new_check_press = r'''
          void InputMacro::checkMacroPress() {
              pressedMacro = -1;

              if (
                  !Switch2FixSupport::
                      isMacroStartRequested()
              ) {
                  return;
              }

              // If a BOOTSEL switch happened while the
              // previous macro was running, discard the
              // previous playback state immediately.
              if (isMacroRunning) {
                  reset();
              }

              const int selectedMacro =
                  Switch2FixSupport::
                      getSelectedMacroIndex();

              if (
                  selectedMacro < 0 ||
                  selectedMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  return;
              }

              Macro& candidate =
                  inputMacroOptions
                      ->macroList[selectedMacro];

              if (
                  !candidate.enabled ||
                  candidate.macroInputs_count == 0
              ) {
                  // Keep the request active. This function
                  // is called again on the next frame.
                  return;
              }

              // The selected macro is passed directly to
              // checkMacroAction() in this same frame.
              pressedMacro = selectedMacro;
          }
          '''

          source = replace_function(
              source,
              "InputMacro::checkMacroPress",
              new_check_press,
          )

          new_check_action = r'''
          void InputMacro::checkMacroAction() {
              if (
                  pressedMacro < 0 ||
                  pressedMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  return;
              }

              if (isMacroRunning) {
                  return;
              }

              Macro& macro =
                  inputMacroOptions
                      ->macroList[pressedMacro];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  return;
              }

              macroPosition = pressedMacro;
              macroInputPosition = 0;
              isMacroTriggerHeld = true;
              prevMacroInputPressed = true;

              // Force continuous looping regardless of
              // the macro type stored in the web config.
              macro.macroType =
                  ON_HOLD_REPEAT;

              MacroInput& macroInput =
                  macro.macroInputs[0];

              uint32_t macroInputDuration =
                  macroInput.duration +
                  macroInput.waitDuration;

              macroInputHoldTime =
                  macroInputDuration <= 0
                      ? INPUT_HOLD_US
                      : macroInputDuration;

              // Start the new macro in this same frame.
              isMacroRunning = true;
              macroStartTime = getMicro();

              // Clear the pending request only after the
              // macro state is completely initialized.
              Switch2FixSupport::
                  markMacroStarted();
          }
          '''

          source = replace_function(
              source,
              "InputMacro::checkMacroAction",
              new_check_action,
          )

          new_preprocess = r'''
          void InputMacro::preprocess()
          {
              Switch2FixSupport::
                  updateSequence();

              FocusModeOptions* focusModeOptions =
                  &Storage::getInstance()
                      .getAddonOptions()
                      .focusModeOptions;

              if (
                  focusModeOptions->enabled &&
                  focusModeOptions
                      ->macroLockEnabled
              ) {
                  Gamepad* gamepad =
                      Storage::getInstance()
                          .GetGamepad();

                  if (
                      focusModeOptions
                          ->overrideEnabled ||
                      (
                          gamepad
                              ->mapFocusMode
                              ->pinMask &&
                          (
                              gamepad
                                  ->debouncedGpio &
                              gamepad
                                  ->mapFocusMode
                                  ->pinMask
                          )
                      )
                  ) {
                      return;
                  }
              }

              // A pending macro request is handled every
              // frame until it really starts.
              checkMacroPress();
              checkMacroAction();

              // Official playback implementation remains
              // unchanged.
              runCurrentMacro();

              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              // Apply automatic A after macro playback.
              Switch2FixSupport::
                  applyAutomaticA(gamepad);
          }
          '''

          source = replace_function(
              source,
              "InputMacro::preprocess",
              new_preprocess,
          )

          macro_file.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          disabled_bootsel_source = '''\
          #include "addons/bootsel_button.h"

          bool BootselButtonAddon::available() {
              return false;
          }

          void BootselButtonAddon::setup() {
          }

          void BootselButtonAddon::preprocess() {
          }
          '''

          bootsel_file.write_text(
              disabled_bootsel_source,
              encoding="utf-8",
              newline="\n",
          )

          print(
              "Direct macro start patch applied"
          )
          print(
              "Automatic A count: 4"
          )
          print(
              "Automatic A interval: 500 ms"
          )
          print(
              "Automatic A mapping: GAMEPAD_MASK_B2"
          )
          print(
              "GP6 selects Macro 2"
          )
          print(
              "GP7 selects Macro 6"
          )
          print(
              "Macro startup is attempted every frame"
          )
          print(
              "Macro startup is initialized in one frame"
          )
          print(
              "Selected macro loops continuously"
          )
          print(
              "BOOTSEL remains available for later toggles"
          )
          print(
              "Official runCurrentMacro() preserved"
          )
          PY

      - name: Verify patched source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MACRO_FILE="src/addons/input_macro.cpp"
          BOOTSEL_FILE="src/addons/bootsel_button.cpp"

          test -f "$INPUT_MACRO_FILE"
          test -f "$BOOTSEL_FILE"

          test "$(
            grep -c \
              "namespace Switch2FixSupport" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "bool InputMacro::available" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::setup" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroPress" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroAction" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::runCurrentMacro" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void Input
