name: Build GP2040-CE BOOTSEL Macro 2-6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CI=false npm run build

      - name: Verify web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/httpd/fsdata.c
          echo "fsdata.c generated successfully"

      - name: Apply safe BOOTSEL patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/addons/input_macro.cpp")
          source = path.read_text()

          include_anchor = '#include "hardware/gpio.h"'

          required_headers = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "helper.h"',
          ]

          if include_anchor not in source:
              raise SystemExit("Cannot find hardware/gpio.h include")

          for header in required_headers:
              if header not in source:
                  source = source.replace(
                      include_anchor,
                      include_anchor + "\n" + header,
                      1,
                  )

          helper_marker = (
              "bool __no_inline_not_in_flash_func("
              "readBootselButton)()"
          )

          if helper_marker not in source:
              available_marker = "bool InputMacro::available() {"

              helper = r'''
          namespace {
          constexpr int BOOTSEL_MACRO_2 = 1;
          constexpr int BOOTSEL_MACRO_6 = 5;

          constexpr uint64_t BOOTSEL_START_DELAY_US = 1000000;
          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US = 50000;
          constexpr uint64_t BOOTSEL_DEBOUNCE_US = 30000;

          uint64_t bootselStartedAt = 0;
          uint64_t bootselLastPollAt = 0;
          uint64_t bootselChangedAt = 0;

          bool bootselRawPressed = false;
          bool bootselStablePressed = false;
          bool bootselPressEvent = false;

          // The first BOOTSEL press runs Macro 6.
          int selectedBootselMacro = BOOTSEL_MACRO_6;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags = save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);
              return pressed;
          }

          void updateBootselButton() {
              uint64_t now = getMicro();

              if (bootselStartedAt == 0) {
                  bootselStartedAt = now;
                  return;
              }

              if (
                  now - bootselStartedAt <
                  BOOTSEL_START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - bootselLastPollAt <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollAt = now;

              bool rawPressed = readBootselButton();

              if (rawPressed != bootselRawPressed) {
                  bootselRawPressed = rawPressed;
                  bootselChangedAt = now;
              }

              if (
                  now - bootselChangedAt >=
                      BOOTSEL_DEBOUNCE_US &&
                  bootselRawPressed !=
                      bootselStablePressed
              ) {
                  bootselStablePressed =
                      bootselRawPressed;

                  if (bootselStablePressed) {
                      bootselPressEvent = true;
                  }
              }
          }
          }
          '''

              if available_marker not in source:
                  raise SystemExit(
                      "Cannot find InputMacro::available()"
                  )

              source = source.replace(
                  available_marker,
                  helper + "\n" + available_marker,
                  1,
              )

          def replace_function(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Cannot find " + signature
                  )

              opening_brace = text.find("{", start)

              if opening_brace < 0:
                  raise SystemExit(
                      "Cannot find opening brace for " +
                      signature
                  )

              depth = 0
              end = -1

              for index in range(
                  opening_brace,
                  len(text)
              ):
                  character = text[index]

                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          end = index + 1
                          break

              if end < 0:
                  raise SystemExit(
                      "Cannot find closing brace for " +
                      signature
                  )

              return (
                  text[:start] +
                  replacement +
                  text[end:]
              )

          new_check_macro_press = r'''
          void InputMacro::checkMacroPress() {
              updateBootselButton();

              // BOOTSEL is the only runtime trigger.
              // GP6 and GP7 input states are ignored.
              pressedMacro = -1;

              if (!bootselPressEvent) {
                  return;
              }

              // Consume exactly one event for each press.
              bootselPressEvent = false;

              if (isMacroRunning) {
                  return;
              }

              if (
                  selectedBootselMacro < 0 ||
                  selectedBootselMacro >= MAX_MACRO_LIMIT
              ) {
                  return;
              }

              if (
                  !inputMacroOptions
                      ->macroList[selectedBootselMacro]
                      .enabled
              ) {
                  return;
              }

              pressedMacro = selectedBootselMacro;
          }
          '''

          new_check_macro_action = r'''
          void InputMacro::checkMacroAction() {
              bool macroInputPressed =
                  pressedMacro >= 0 &&
                  pressedMacro < MAX_MACRO_LIMIT;

              if (!macroInputPressed) {
                  prevMacroInputPressed = false;
                  return;
              }

              if (isMacroRunning) {
                  prevMacroInputPressed = false;
                  return;
              }

              macroPosition = pressedMacro;

              if (
                  macroPosition < 0 ||
                  macroPosition >= MAX_MACRO_LIMIT
              ) {
                  reset();
                  return;
              }

              Macro& macro =
                  inputMacroOptions
                      ->macroList[macroPosition];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  reset();
                  return;
              }

              macroInputPosition = 0;
              isMacroTriggerHeld = true;

              MacroInput& macroInput =
                  macro.macroInputs[macroInputPosition];

              uint32_t macroInputDuration =
                  macroInput.duration +
                  macroInput.waitDuration;

              macroInputHoldTime =
                  macroInputDuration <= 0
                      ? INPUT_HOLD_US
                      : macroInputDuration;

              isMacroRunning = true;
              macroStartTime = getMicro();

              // Alternate only after a macro starts.
              selectedBootselMacro =
                  selectedBootselMacro ==
                          BOOTSEL_MACRO_6
                      ? BOOTSEL_MACRO_2
                      : BOOTSEL_MACRO_6;

              prevMacroInputPressed = false;
          }
          '''

          source = replace_function(
              source,
              "void InputMacro::checkMacroPress()",
              new_check_macro_press,
          )

          source = replace_function(
              source,
              "void InputMacro::checkMacroAction()",
              new_check_macro_action,
          )

          path.write_text(source)

          print("Safe BOOTSEL patch applied successfully")
          print("First BOOTSEL press: Macro 6")
          print("Second BOOTSEL press: Macro 2")
          print("GP6 and GP7 GPIO states are ignored")
          PY

      - name: Verify safe BOOTSEL patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/input_macro.cpp

          grep -q "readBootselButton" \
            src/addons/input_macro.cpp

          grep -q "BOOTSEL_MACRO_2 = 1" \
            src/addons/input_macro.cpp

          grep -q "BOOTSEL_MACRO_6 = 5" \
            src/addons/input_macro.cpp

          grep -q "macroPosition < 0" \
            src/addons/input_macro.cpp

          grep -q "macro.macroInputs_count == 0" \
            src/addons/input_macro.cpp

          echo "Safe BOOTSEL patch verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"
            find gp2040-ce/build -type f | sort
            exit 1
          fi

          echo "Generated UF2: $UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-Pico-BOOTSEL-Safe-Macro2-Macro6.uf2

          sha256sum \
            GP2040-CE-Pico-BOOTSEL-Safe-Macro2-Macro6.uf2 \
            > SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-BOOTSEL-Safe-Macro2-Macro6
          path: |
            GP2040-CE-Pico-BOOTSEL-Safe-Macro2-Macro6.uf2
            SHA256SUMS.txt
          if-no-files-found: error
