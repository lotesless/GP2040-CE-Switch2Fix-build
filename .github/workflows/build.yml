name: Build GP2040-CE Switch 2 Five A Macro Selector

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK verified:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Generated web filesystem:"
          ls -lh lib/httpd/fsdata.c

      - name: Apply five A and macro selector patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          macro_file = Path(
              "src/addons/input_macro.cpp"
          )

          bootsel_file = Path(
              "src/addons/bootsel_button.cpp"
          )

          if not macro_file.is_file():
              raise SystemExit(
                  "src/addons/input_macro.cpp was not found"
              )

          if not bootsel_file.is_file():
              raise SystemExit(
                  "src/addons/bootsel_button.cpp was not found"
              )

          source = macro_file.read_text(
              encoding="utf-8"
          )

          source = source.replace(
              "\r\n",
              "\n",
          ).replace(
              "\r",
              "\n",
          )

          if "namespace Switch2FixSupport" in source:
              raise SystemExit(
                  "Switch2FixSupport already exists"
              )

          def find_function_span(
              text,
              signatures,
              function_name,
          ):
              positions = []

              for signature in signatures:
                  position = text.find(signature)

                  if position >= 0:
                      positions.append(
                          (position, signature)
                      )

              if len(positions) != 1:
                  raise SystemExit(
                      "Expected exactly one "
                      + function_name
                      + " signature, found "
                      + str(len(positions))
                  )

              start, signature = positions[0]

              opening_brace = text.find(
                  "{",
                  start + len(signature),
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Opening brace for "
                      + function_name
                      + " was not found"
                  )

              between = text[
                  start + len(signature):
                  opening_brace
              ]

              if between.strip():
                  raise SystemExit(
                      "Unexpected text before opening "
                      "brace of "
                      + function_name
                  )

              depth = 0
              closing_brace = -1

              for position in range(
                  opening_brace,
                  len(text),
              ):
                  character = text[position]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          closing_brace = position
                          break

              if closing_brace < 0:
                  raise SystemExit(
                      "Closing brace for "
                      + function_name
                      + " was not found"
                  )

              return start, closing_brace + 1

          def replace_function(
              text,
              signatures,
              function_name,
              replacement,
          ):
              start, end = find_function_span(
                  text,
                  signatures,
                  function_name,
              )

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          gpio_include = (
              '#include "hardware/gpio.h"'
          )

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "tusb.h"',
          ]

          if gpio_include not in source:
              raise SystemExit(
                  "hardware/gpio.h include was not found"
              )

          missing_includes = [
              include_line
              for include_line in required_includes
              if include_line not in source
          ]

          if missing_includes:
              source = source.replace(
                  gpio_include,
                  (
                      gpio_include
                      + "\n"
                      + "\n".join(missing_includes)
                  ),
                  1,
              )

          new_available = r'''
          bool InputMacro::available() {
              // Keep InputMacro active for the automatic
              // A sequence and BOOTSEL selection window.
              return true;
          }
          '''

          source = replace_function(
              source,
              [
                  "bool InputMacro::available()",
                  "bool InputMacro::available ()",
              ],
              "InputMacro::available()",
              new_available,
          )

          setup_start, setup_end = find_function_span(
              source,
              [
                  "void InputMacro::setup()",
                  "void InputMacro::setup ()",
              ],
              "InputMacro::setup()",
          )

          helper_code = r'''
          namespace Switch2FixSupport {

          enum class SequenceStage {
              WAITING_FOR_USB,
              AUTO_A,
              MACRO_SELECTION,
              START_MACRO,
              MACRO_RUNNING
          };

          constexpr uint GP6_PIN = 6;
          constexpr uint GP7_PIN = 7;

          // Give the Switch 2 USB connection time to settle
          // before injecting the first controller input.
          constexpr uint64_t USB_SETTLE_DELAY_US =
              2000000;

          constexpr int AUTO_A_PRESS_COUNT = 5;

          // Start-to-start interval between A presses.
          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          // Start the macro ten seconds after the fifth
          // automatic A button has been released.
          constexpr uint64_t MACRO_SELECTION_WINDOW_US =
              10000000;

          // BOOTSEL is sampled only during the selection
          // window and stops being sampled afterward.
          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              5000;

          constexpr uint64_t BOOTSEL_RELEASE_DEBOUNCE_US =
              30000;

          SequenceStage stage =
              SequenceStage::WAITING_FOR_USB;

          bool usbWasMounted = false;
          uint64_t usbMountedAt = 0;

          int autoAPressCount = 0;
          bool autoAIsPressed = false;
          uint64_t autoAPressStartedAt = 0;
          uint64_t nextAutoAPressAt = 0;

          uint64_t selectionStartedAt = 0;
          uint64_t selectionEndsAt = 0;

          bool useGp7Macro = false;
          bool macroStartRequest = false;

          uint64_t bootselLastPollAt = 0;
          uint64_t bootselReleaseStartedAt = 0;
          bool bootselPressLocked = false;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (
                  volatile int delay = 0;
                  delay < 1000;
                  ++delay
              ) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void resetSession() {
              stage =
                  SequenceStage::WAITING_FOR_USB;

              usbMountedAt = 0;

              autoAPressCount = 0;
              autoAIsPressed = false;
              autoAPressStartedAt = 0;
              nextAutoAPressAt = 0;

              selectionStartedAt = 0;
              selectionEndsAt = 0;

              useGp7Macro = false;
              macroStartRequest = false;

              bootselLastPollAt = 0;
              bootselReleaseStartedAt = 0;
              bootselPressLocked = false;
          }

          void updateUsbConnection() {
              bool mounted = tud_mounted();
              uint64_t now = getMicro();

              if (!mounted) {
                  if (usbWasMounted) {
                      resetSession();
                  }

                  usbWasMounted = false;
                  return;
              }

              if (!usbWasMounted) {
                  resetSession();

                  usbWasMounted = true;
                  usbMountedAt = now;

                  nextAutoAPressAt =
                      now + USB_SETTLE_DELAY_US;

                  stage =
                      SequenceStage::AUTO_A;
              }
          }

          void updateBootselSelection() {
              if (
                  stage !=
                  SequenceStage::MACRO_SELECTION
              ) {
                  return;
              }

              uint64_t now = getMicro();

              if (now >= selectionEndsAt) {
                  stage =
                      SequenceStage::START_MACRO;

                  macroStartRequest = true;
                  return;
              }

              if (
                  now - bootselLastPollAt <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollAt = now;

              bool pressed =
                  readBootselButton();

              if (pressed) {
                  bootselReleaseStartedAt = 0;

                  if (!bootselPressLocked) {
                      bootselPressLocked = true;

                      // One BOOTSEL press during the
                      // ten-second window permanently
                      // selects the GP7 macro.
                      useGp7Macro = true;
                  }

                  return;
              }

              if (!bootselPressLocked) {
                  return;
              }

              if (
                  bootselReleaseStartedAt == 0
              ) {
                  bootselReleaseStartedAt = now;
                  return;
              }

              if (
                  now - bootselReleaseStartedAt >=
                  BOOTSEL_RELEASE_DEBOUNCE_US
              ) {
                  bootselPressLocked = false;
                  bootselReleaseStartedAt = 0;
              }
          }

          void updateSequence() {
              updateUsbConnection();

              if (!usbWasMounted) {
                  return;
              }

              uint64_t now = getMicro();

              if (
                  stage ==
                  SequenceStage::AUTO_A
              ) {
                  if (
                      !autoAIsPressed &&
                      autoAPressCount <
                          AUTO_A_PRESS_COUNT &&
                      now >= nextAutoAPressAt
                  ) {
                      autoAIsPressed = true;
                      autoAPressStartedAt = now;
                  }

                  if (
                      autoAIsPressed &&
                      now - autoAPressStartedAt >=
                          AUTO_A_HOLD_US
                  ) {
                      autoAIsPressed = false;
                      ++autoAPressCount;

                      if (
                          autoAPressCount >=
                          AUTO_A_PRESS_COUNT
                      ) {
                          selectionStartedAt = now;

                          selectionEndsAt =
                              now +
                              MACRO_SELECTION_WINDOW_US;

                          useGp7Macro = false;
                          bootselLastPollAt = 0;
                          bootselReleaseStartedAt = 0;
                          bootselPressLocked = false;

                          stage =
                              SequenceStage::
                                  MACRO_SELECTION;
                      } else {
                          // Preserve a 500 ms start-to-start
                          // interval rather than adding the
                          // hold duration to the interval.
                          nextAutoAPressAt =
                              autoAPressStartedAt +
                              AUTO_A_INTERVAL_US;
                      }
                  }
              }

              updateBootselSelection();
          }

          void applyAutomaticA(
              Gamepad* gamepad
          ) {
              if (
                  stage ==
                      SequenceStage::AUTO_A &&
                  autoAIsPressed
              ) {
                  // GP2040-CE SwitchProDriver maps B2
                  // to Nintendo Switch A.
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B2;
              }
          }

          bool consumeMacroStartRequest() {
              if (!macroStartRequest) {
                  return false;
              }

              macroStartRequest = false;
              return true;
          }

          uint getSelectedGpio() {
              return useGp7Macro
                  ? GP7_PIN
                  : GP6_PIN;
          }

          bool isSelectingGp7() {
              return useGp7Macro;
          }

          void markMacroRunning() {
              stage =
                  SequenceStage::MACRO_RUNNING;
          }

          void retryMacroStart() {
              if (
                  stage ==
                  SequenceStage::START_MACRO
              ) {
                  macroStartRequest = true;
              }
          }

          }
          '''

          source = (
              source[:setup_start]
              + helper_code.strip()
              + "\n\n"
              + source[setup_start:]
          )

          new_check_press = r'''
          void InputMacro::checkMacroPress() {
              pressedMacro = -1;

              if (
                  !Switch2FixSupport::
                      consumeMacroStartRequest()
              ) {
                  return;
              }

              if (isMacroRunning) {
                  return;
              }

              const uint selectedGpio =
                  Switch2FixSupport::
                      getSelectedGpio();

              const uint32_t selectedPinMask =
                  static_cast<uint32_t>(1u)
                  << selectedGpio;

              int selectedMacro = -1;

              // Resolve the macro dynamically from the
              // GP6 or GP7 pin mapping. This does not assume
              // fixed Macro 2 or Macro 6 array indexes.
              for (
                  int index = 0;
                  index < MAX_MACRO_LIMIT;
                  ++index
              ) {
                  if (
                      macroPinMasks[index] &
                      selectedPinMask
                  ) {
                      selectedMacro = index;
                      break;
                  }
              }

              if (selectedMacro < 0) {
                  return;
              }

              Macro& macro =
                  inputMacroOptions
                      ->macroList[selectedMacro];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  return;
              }

              pressedMacro = selectedMacro;
          }
          '''

          source = replace_function(
              source,
              [
                  "void InputMacro::checkMacroPress()",
                  "void InputMacro::checkMacroPress ()",
              ],
              "InputMacro::checkMacroPress()",
              new_check_press,
          )

          new_check_action = r'''
          void InputMacro::checkMacroAction() {
              if (
                  pressedMacro < 0 ||
                  pressedMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  return;
              }

              if (isMacroRunning) {
                  return;
              }

              macroPosition = pressedMacro;
              macroInputPosition = 0;

              isMacroTriggerHeld = true;
              prevMacroInputPressed = true;

              Macro& macro =
                  inputMacroOptions
                      ->macroList[macroPosition];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  reset();
                  return;
              }

              // The selected GP6 or GP7 macro continuously
              // repeats after the ten-second window.
              macro.macroType =
                  ON_HOLD_REPEAT;

              MacroInput& macroInput =
                  macro.macroInputs[0];

              uint32_t macroInputDuration =
                  macroInput.duration +
                  macroInput.waitDuration;

              macroInputHoldTime =
                  macroInputDuration <= 0
                      ? INPUT_HOLD_US
                      : macroInputDuration;

              isMacroRunning = true;
              macroStartTime = getMicro();

              Switch2FixSupport::
                  markMacroRunning();
          }
          '''

          source = replace_function(
              source,
              [
                  "void InputMacro::checkMacroAction()",
                  "void InputMacro::checkMacroAction ()",
              ],
              "InputMacro::checkMacroAction()",
              new_check_action,
          )

          new_preprocess = r'''
          void InputMacro::preprocess()
          {
              Switch2FixSupport::
                  updateSequence();

              FocusModeOptions* focusModeOptions =
                  &Storage::getInstance()
                      .getAddonOptions()
                      .focusModeOptions;

              if (
                  focusModeOptions->enabled &&
                  focusModeOptions
                      ->macroLockEnabled
              ) {
                  Gamepad* gamepad =
                      Storage::getInstance()
                          .GetGamepad();

                  if (
                      focusModeOptions
                          ->overrideEnabled ||
                      (
                          gamepad
                              ->mapFocusMode
                              ->pinMask &&
                          (
                              gamepad
                                  ->debouncedGpio &
                              gamepad
                                  ->mapFocusMode
                                  ->pinMask
                          )
                      )
                  ) {
                      return;
                  }
              }

              checkMacroPress();
              checkMacroAction();

              // Keep using the official GP2040-CE macro
              // playback implementation.
              runCurrentMacro();

              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              // Apply automatic Switch A after normal macro
              // processing. The macro has not started yet
              // while the five-A sequence is running.
              Switch2FixSupport::
                  applyAutomaticA(gamepad);
          }
          '''

          source = replace_function(
              source,
              [
                  "void InputMacro::preprocess()",
                  "void InputMacro::preprocess ()",
              ],
              "InputMacro::preprocess()",
              new_preprocess,
          )

          macro_file.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          disabled_bootsel_source = '''\
          #include "addons/bootsel_button.h"

          bool BootselButtonAddon::available() {
              return false;
          }

          void BootselButtonAddon::setup() {
          }

          void BootselButtonAddon::preprocess() {
          }
          '''

          bootsel_file.write_text(
              disabled_bootsel_source,
              encoding="utf-8",
              newline="\n",
          )

          print(
              "Five-A macro selector patch applied"
          )
          print(
              "Automatic button: Switch A / B2"
          )
          print(
              "Automatic A count: 5"
          )
          print(
              "Automatic A interval: 500 ms"
          )
          print(
              "Macro selection window: 10 seconds"
          )
          print(
              "Default selection: GP6 mapped macro"
          )
          print(
              "BOOTSEL selection: GP7 mapped macro"
          )
          print(
              "Selected macro mode: continuous repeat"
          )
          print(
              "BOOTSEL polling stops after selection"
          )
          print(
              "Official runCurrentMacro() preserved"
          )
          PY

      - name: Verify patched source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MACRO_FILE="src/addons/input_macro.cpp"
          BOOTSEL_FILE="src/addons/bootsel_button.cpp"

          test -f "$INPUT_MACRO_FILE"
          test -f "$BOOTSEL_FILE"

          test "$(
            grep -c \
              "namespace Switch2FixSupport" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "bool InputMacro::available" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::setup" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroPress" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroAction" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::runCurrentMacro" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::preprocess" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          grep -q \
            '#include "tusb.h"' \
            "$INPUT_MACRO_FILE"

          grep -q \
            "tud_mounted()" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_PRESS_COUNT = 5" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_INTERVAL_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_HOLD_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_SELECTION_WINDOW_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "GAMEPAD_MASK_B2" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "constexpr uint GP6_PIN = 6" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "constexpr uint GP7_PIN = 7" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "getSelectedGpio" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "macroPinMasks\[index\]" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "readBootselButton" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "restore_interrupts(flags)" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "macro.macroType" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "ON_HOLD_REPEAT" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "bool BootselButtonAddon::available" \
            "$BOOTSEL_FILE"

          grep -q \
            "return false" \
            "$BOOTSEL_FILE"

          if grep -q \
            "GAMEPAD_MASK_B1" \
            "$INPUT_MACRO_FILE"; then
            echo "Wrong Switch B mapping found"
            exit 1
          fi

          if grep -q \
            "restore_interrupts_from_disabled" \
            "$INPUT_MACRO_FILE"; then
            echo "Unsupported interrupt restore function found"
            exit 1
          fi

          if grep -q \
            "allPins |= macroPinMasks" \
            "$INPUT_MACRO_FILE"; then
            echo "Old virtual GPIO trigger found"
            exit 1
          fi

          echo "Patched source verification passed"

          echo
          echo "InputMacro function locations:"
          grep \
            -n \
            -E \
            "InputMacro::(available|setup|checkMacroPress|checkMacroAction|runCurrentMacro|preprocess)" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Five-A settings:"
          grep \
            -n \
            -E \
            "AUTO_A_PRESS_COUNT|AUTO_A_INTERVAL_US|AUTO_A_HOLD_US|GAMEPAD_MASK_B2" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Macro selector settings:"
          grep \
            -n \
            -E \
            "GP6_PIN|GP7_PIN|MACRO_SELECTION_WINDOW_US|ON_HOLD_REPEAT" \
            "$INPUT_MACRO_FILE"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"
          test -f lib/httpd/fsdata.c

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated Pico UF2
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_UF2="gp2040-ce/build/GP2040-CE_0.7.12_Pico.uf2"

          if [ -f "$EXPECTED_UF2" ]; then
            UF2_FILE="$EXPECTED_UF2"
          else
            UF2_FILE="$(
              find gp2040-ce/build \
                -type f \
                -name "GP2040-CE_*_Pico.uf2" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "${UF2_FILE:-}" ]; then
            echo "Pico UF2 file was not generated"

            find gp2040-ce/build \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          test -f "$UF2_FILE"
          test -s "$UF2_FILE"

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Selected UF2:"
          echo "$UF2_FILE"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

