name: Build GP2040-CE BOOTSEL Macro 2-6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c
          echo "fsdata.c generated successfully"

      - name: Apply BOOTSEL macro bridge patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/addons/bootsel_button.cpp")
          source = path.read_text()

          include_anchor = '#include "addons/bootsel_button.h"'

          required_includes = [
              '#include "storagemanager.h"',
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "helper.h"',
              '#include "config.pb.h"',
          ]

          if include_anchor not in source:
              raise SystemExit(
                  "Cannot find BOOTSEL include anchor"
              )

          # 先确保所有头文件出现在自定义代码之前。
          include_block = include_anchor

          for include_line in required_includes:
              if include_line not in source:
                  include_block += "\n" + include_line

          # 删除可能由旧版本脚本插入的旧命名空间代码。
          namespace_start = source.find(
              "namespace BootselMacroBridge"
          )

          if namespace_start >= 0:
              namespace_open = source.find(
                  "{",
                  namespace_start
              )

              if namespace_open < 0:
                  raise SystemExit(
                      "Broken BootselMacroBridge namespace"
                  )

              depth = 0
              namespace_end = -1

              for index in range(
                  namespace_open,
                  len(source)
              ):
                  character = source[index]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          namespace_end = index + 1
                          break

              if namespace_end < 0:
                  raise SystemExit(
                      "Cannot close old BootselMacroBridge namespace"
                  )

              line_start = source.rfind(
                  "\n",
                  0,
                  namespace_start
              ) + 1

              source = (
                  source[:line_start] +
                  source[namespace_end:]
              )

          # 确保 required includes 被放在所有函数和命名空间之前。
          first_function = source.find(
              "bool BootselButtonAddon::"
          )

          if first_function < 0:
              raise SystemExit(
                  "Cannot find BOOTSEL addon functions"
              )

          prefix = source[:first_function]

          # 删除旧版本中可能残留的 required includes。
          for include_line in required_includes:
              prefix = prefix.replace(
                  include_line + "\n",
                  ""
              )

          prefix = prefix.rstrip()

          namespace_code = r'''
          namespace BootselMacroBridge {

          constexpr uint32_t MACRO_2_GPIO_MASK =
              1u << 6;

          constexpr uint32_t MACRO_6_GPIO_MASK =
              1u << 7;

          constexpr uint64_t START_DELAY_US =
              1000000;

          constexpr uint64_t POLL_INTERVAL_US =
              50000;

          constexpr uint64_t DEBOUNCE_US =
              30000;

          uint64_t startedAt = 0;
          uint64_t lastPollAt = 0;
          uint64_t changedAt = 0;

          bool rawPressed = false;
          bool stablePressed = false;

          // 第一次按下 BOOTSEL 使用 Macro 6。
          uint32_t activeMacroMask =
              MACRO_6_GPIO_MASK;

          bool __no_inline_not_in_flash_func(
              readBootselForMacro
          )() {
              const uint CS_PIN_INDEX = 1;

              // 临时关闭中断，读取 QSPI BOOTSEL。
              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              // 这里不能调用位于 Flash 中的函数。
              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              // BOOTSEL 为低电平有效。
              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              // 恢复 QSPI CS 引脚状态。
              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              // GP2040-CE v0.7.12 官方 Pico SDK
              // 使用这个函数恢复中断状态。
              restore_interrupts(flags);

              return pressed;
          }

          void update() {
              uint64_t now = getMicro();

              if (startedAt == 0) {
                  startedAt = now;
                  changedAt = now;
                  return;
              }

              // 启动后一秒才开始读取 BOOTSEL。
              if (
                  now - startedAt <
                  START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - lastPollAt <
                  POLL_INTERVAL_US
              ) {
                  return;
              }

              lastPollAt = now;

              bool currentRaw =
                  readBootselForMacro();

              if (currentRaw != rawPressed) {
                  rawPressed = currentRaw;
                  changedAt = now;
              }

              if (
                  now - changedAt >=
                      DEBOUNCE_US &&
                  rawPressed != stablePressed
              ) {
                  stablePressed = rawPressed;

                  // 在释放 BOOTSEL 后切换到下一个宏。
                  //
                  // 第一次按下：Macro 6
                  // 第二次按下：Macro 2
                  // 第三次按下：Macro 6
                  // 第四次按下：Macro 2
                  if (!stablePressed) {
                      if (
                          activeMacroMask ==
                          MACRO_6_GPIO_MASK
                      ) {
                          activeMacroMask =
                              MACRO_2_GPIO_MASK;
                      } else {
                          activeMacroMask =
                              MACRO_6_GPIO_MASK;
                      }
                  }
              }
          }

          void applyVirtualMacroPin(
              Gamepad* gamepad
          ) {
              const uint32_t bothMacroMasks =
                  MACRO_2_GPIO_MASK |
                  MACRO_6_GPIO_MASK;

              // 清除 GP6 和 GP7 的真实物理输入状态。
              // 两个引脚可以保持悬空，不需要接地。
              gamepad->debouncedGpio &=
                  ~bothMacroMasks;

              // BOOTSEL 按下时，仅模拟一个宏引脚。
              if (stablePressed) {
                  gamepad->debouncedGpio |=
                      activeMacroMask;
              }
          }

          }
          '''

          # 重新构造文件：
          # 官方头文件
          # 自定义命名空间
          # 官方函数
          rebuilt_prefix = (
              include_block +
              "\n\n" +
              namespace_code.strip() +
              "\n\n"
          )

          source = (
              rebuilt_prefix +
              source[first_function:]
          )

          def replace_function(
              text,
              signature,
              replacement
          ):
              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Cannot find function: " +
                      signature
                  )

              opening_brace = text.find(
                  "{",
                  start
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Cannot find opening brace: " +
                      signature
                  )

              depth = 0
              end = -1

              for index in range(
                  opening_brace,
                  len(text)
              ):
                  character = text[index]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          end = index + 1
                          break

              if end < 0:
                  raise SystemExit(
                      "Cannot find closing brace: " +
                      signature
                  )

              return (
                  text[:start] +
                  replacement +
                  text[end:]
              )

          new_available = r'''
          bool BootselButtonAddon::available() {
              // 即使网页中没有配置官方 BOOTSEL 按钮，
              // 也必须加载该插件来提供宏桥接。
              return true;
          }
          '''

          new_setup = r'''
          void BootselButtonAddon::setup() {
              const BootselButtonOptions& options =
                  Storage::getInstance()
                      .getAddonOptions()
                      .bootselButtonOptions;

              // 保留官方 BOOTSEL 按钮映射。
              bootselButtonMap =
                  options.buttonMap;
          }
          '''

          new_preprocess = r'''
          void BootselButtonAddon::preprocess() {
              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              BootselMacroBridge::update();

              // 保留官方 BOOTSEL 按钮功能。
              if (
                  BootselMacroBridge::stablePressed &&
                  bootselButtonMap != 0
              ) {
                  switch (bootselButtonMap) {
                      case GAMEPAD_MASK_DU:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_UP;
                          break;

                      case GAMEPAD_MASK_DD:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_DOWN;
                          break;

                      case GAMEPAD_MASK_DL:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_LEFT;
                          break;

                      case GAMEPAD_MASK_DR:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_RIGHT;
                          break;

                      default:
                          gamepad->state.buttons |=
                              bootselButtonMap;
                          break;
                  }
              }

              // 将 BOOTSEL 转换为 GP6 或 GP7 的虚拟宏输入。
              BootselMacroBridge::applyVirtualMacroPin(
                  gamepad
              );
          }
          '''

          source = replace_function(
              source,
              "bool BootselButtonAddon::available()",
              new_available
          )

          source = replace_function(
              source,
              "void BootselButtonAddon::setup()",
              new_setup
          )

          source = replace_function(
              source,
              "void BootselButtonAddon::preprocess()",
              new_preprocess
          )

          path.write_text(source)

          print(
              "BOOTSEL macro bridge patch applied successfully"
          )
          print(
              "All SDK headers are before custom code"
          )
          print(
              "Using restore_interrupts(flags)"
          )
          print(
              "Official input_macro.cpp remains unchanged"
          )
          print(
              "First press selects Macro 6"
          )
          print(
              "Second press selects Macro 2"
          )
          PY

      - name: Verify BOOTSEL patch order
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/bootsel_button.cpp

          grep -q "namespace BootselMacroBridge" \
            src/addons/bootsel_button.cpp

          grep -q "MACRO_2_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q "MACRO_6_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q "readBootselForMacro" \
            src/addons/bootsel_button.cpp

          grep -q "restore_interrupts(flags)" \
            src/addons/bootsel_button.cpp

          grep -q "applyVirtualMacroPin" \
            src/addons/bootsel_button.cpp

          grep -q "return true" \
            src/addons/bootsel_button.cpp

          test -f src/addons/input_macro.cpp

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "src/addons/bootsel_button.cpp"
          ).read_text()

          namespace_position = source.find(
              "namespace BootselMacroBridge"
          )

          sync_position = source.find(
              '#include "hardware/sync.h"'
          )

          qspi_position = source.find(
              '#include "hardware/structs/ioqspi.h"'
          )

          if sync_position < 0:
              raise SystemExit(
                  "hardware/sync.h is missing"
              )

          if qspi_position < 0:
              raise SystemExit(
                  "hardware/structs/ioqspi.h is missing"
              )

          if namespace_position < 0:
              raise SystemExit(
                  "BootselMacroBridge is missing"
              )

          if sync_position > namespace_position:
              raise SystemExit(
                  "hardware/sync.h appears after custom code"
              )

          if qspi_position > namespace_position:
              raise SystemExit(
                  "ioqspi.h appears after custom code"
              )

          print(
              "Header order verification passed"
          )
          PY

          echo "BOOTSEL patch verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"

            find gp2040-ce/build \
              -type f \
              | sort

            exit 1
          fi

          echo "Generated UF2: $UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2

          sha256sum \
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2 \
            > SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6
          path: |
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2
            SHA256SUMS.txt
          if-no-files-found: error
