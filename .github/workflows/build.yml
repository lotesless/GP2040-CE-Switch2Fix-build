name: Build GP2040-CE Pico BOOTSEL Macro Switch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          CI=false npm run build

      - name: Verify web filesystem source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/httpd/fsdata.c
          echo "Found lib/httpd/fsdata.c"
          wc -c lib/httpd/fsdata.c

      - name: Apply BOOTSEL Macro 2 and Macro 6 switch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/addons/input_macro.cpp")
          source = path.read_text()
          newline = chr(10)

          # The QSPI register field macros are defined in io_qspi.h.
          # ioqspi.h alone only provides compatibility aliases.
          include_anchor = '#include "hardware/gpio.h"'
          required_headers = [
              '#include "hardware/sync.h"',
              '#include "hardware/regs/io_qspi.h"',
              '#include "hardware/structs/io_qspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          if include_anchor not in source:
              raise SystemExit("Cannot find hardware/gpio.h include")

          for header in required_headers:
              if header not in source:
                  source = source.replace(
                      include_anchor,
                      include_anchor + newline + header,
                      1,
                  )

          available_marker = "bool InputMacro::available() {"
          if available_marker not in source:
              raise SystemExit("Cannot find InputMacro::available marker")

          helper = r'''namespace {
          constexpr int BOOTSEL_MACRO_2 = 1;
          constexpr int BOOTSEL_MACRO_6 = 5;
          constexpr uint64_t BOOTSEL_START_DELAY_US = 1000000;
          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US = 50000;
          constexpr uint64_t BOOTSEL_DEBOUNCE_US = 30000;

          uint64_t bootselStartedAt = 0;
          uint64_t bootselLastPollAt = 0;
          uint64_t bootselChangedAt = 0;
          bool bootselRawPressed = false;
          bool bootselStablePressed = false;
          int selectedMacro = BOOTSEL_MACRO_6;

          // BOOTSEL uses the RP2040 QSPI CS pin.
          // This function must execute from SRAM while the QSPI CS override
          // is active, otherwise code may be fetched from Flash at that time.
          bool __no_inline_not_in_flash_func(readBootselButton)() {
              const uint CS_PIN_INDEX = 1;
              uint32_t irq_state = save_and_disable_interrupts();

              hw_write_masked(
                  &io_qspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              // BOOTSEL is active low.
              bool pressed = !(sio_hw->gpio_hi_in & (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &io_qspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(irq_state);
              return pressed;
          }

          void updateBootselSelector() {
              uint64_t now = getMicro();

              if (bootselStartedAt == 0) {
                  bootselStartedAt = now;
                  return;
              }

              // Do not access QSPI during initial USB startup.
              if (now - bootselStartedAt < BOOTSEL_START_DELAY_US) {
                  return;
              }

              if (now - bootselLastPollAt < BOOTSEL_POLL_INTERVAL_US) {
                  return;
              }

              bootselLastPollAt = now;
              bool raw_pressed = readBootselButton();

              if (raw_pressed != bootselRawPressed) {
                  bootselRawPressed = raw_pressed;
                  bootselChangedAt = now;
              }

              if (now - bootselChangedAt >= BOOTSEL_DEBOUNCE_US &&
                  bootselRawPressed != bootselStablePressed) {
                  bootselStablePressed = bootselRawPressed;

                  // Change selection only on a stable press edge.
                  if (bootselStablePressed) {
                      selectedMacro =
                          selectedMacro == BOOTSEL_MACRO_6
                              ? BOOTSEL_MACRO_2
                              : BOOTSEL_MACRO_6;
                  }
              }
          }
          }
          '''

          if "readBootselButton" not in source:
              source = source.replace(
                  available_marker,
                  helper + newline + available_marker,
                  1,
              )

          press_start_marker = "void InputMacro::checkMacroPress() {"
          press_end_marker = "void InputMacro::checkMacroAction() {"
          press_start = source.find(press_start_marker)
          press_end = source.find(press_end_marker)

          if press_start < 0 or press_end <= press_start:
              raise SystemExit("Cannot locate macro check functions")

          new_check_macro_press = r'''void InputMacro::checkMacroPress() {
              updateBootselSelector();

              Gamepad * gamepad = Storage::getInstance().GetGamepad();
              Mask_t allPins = gamepad->debouncedGpio;
              pressedMacro = -1;

              // Configure GP6 as Macro 6 in Pin Mapping.
              // The firmware uses that physical pin as a shared trigger.
              if (macroPinMasks[BOOTSEL_MACRO_6] &&
                  (allPins & macroPinMasks[BOOTSEL_MACRO_6])) {
                  pressedMacro = selectedMacro;
                  return;
              }

              // Preserve official GP2040-CE behavior for other macro inputs.
              for (int i = 0; i < MAX_MACRO_LIMIT; i++) {
                  if (!inputMacroOptions->macroList[i].enabled)
                      continue;

                  Macro * macro = &inputMacroOptions->macroList[i];

                  if (macro->useMacroTriggerButton) {
                      if ((allPins & macroButtonMask) &&
                          ((gamepad->state.buttons & macro->macroTriggerButton) ||
                           (gamepad->state.dpad &
                            (macro->macroTriggerButton >> 16)))) {
                          pressedMacro = i;
                          break;
                      }
                  } else if (allPins & macroPinMasks[i]) {
                      pressedMacro = i;
                      break;
                  }
              }
          }

          '''

          source = source[:press_start] + new_check_macro_press + source[press_end:]

          # Prevent macroList[-1] access while still allowing a running macro
          # to continue through runCurrentMacro().
          action_marker = "void InputMacro::checkMacroAction() {"
          action_line = "    bool macroInputPressed = (pressedMacro != -1);"

          safe_action_line = r'''    bool macroInputPressed = (pressedMacro != -1);

              if (!macroInputPressed) {
                  prevMacroInputPressed = false;

                  // ON_HOLD_REPEAT must stop when GP6 is released.
                  // ON_PRESS and ON_TOGGLE continue through runCurrentMacro().
                  if (isMacroRunning &&
                      inputMacroOptions->macroList[macroPosition].macroType == ON_HOLD_REPEAT) {
                      isMacroTriggerHeld = false;
                  }

                  return;
              }'''

          if action_line not in source:
              raise SystemExit("Cannot find macroInputPressed line")

          source = source.replace(action_line, safe_action_line, 1)
          path.write_text(source)

          print("BOOTSEL Macro 2/6 patch applied successfully")
          print("Configure GP6 as Macro 6 in Pin Mapping")
          print("BOOTSEL toggles the shared GP6 trigger between Macro 2 and Macro 6")
          PY

      - name: Verify generated C++ patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          grep -n "hardware/regs/io_qspi.h" src/addons/input_macro.cpp
          grep -n "readBootselButton" src/addons/input_macro.cpp
          grep -n "BOOTSEL_MACRO_2" src/addons/input_macro.cpp
          if grep -nF '\\bool' src/addons/input_macro.cpp; then
            echo "Invalid literal backslash sequence found in C++ source"
            exit 1
          fi

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/pico-sdk"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico UF2
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Find and verify UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE=$(find gp2040-ce/build -type f -name '*.uf2' | head -n 1)

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"
            find gp2040-ce/build -type f | sort
            exit 1
          fi

          echo "Generated UF2: $UF2_FILE"
          cp "$UF2_FILE" GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2
          sha256sum GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2 | tee SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-BOOTSEL-MacroSwitch
          path: |
            GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="bootsel-macro-switch-${GITHUB_RUN_NUMBER}"

          gh release create "$RELEASE_TAG" \
            GP2040-CE-Pico-BOOTSEL-MacroSwitch.uf2 \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "GP2040-CE Pico BOOTSEL Macro Switch" \
            --notes "GP2040-CE v0.7.12 Pico build. GP6 is the shared macro trigger. The onboard BOOTSEL button toggles GP6 between Macro 2 and Macro 6 after startup."
        env:
          GH_TOKEN: ${{ github.token }}
