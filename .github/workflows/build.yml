name: Build GP2040-CE Switch2 Auto A Macro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK is available:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build official web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Official web filesystem generated successfully"

      - name: Install BOOTSEL bridge and automatic A sequence
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cat > src/addons/bootsel_button.cpp <<'CPP'
          #include "addons/bootsel_button.h"
          #include "storagemanager.h"
          #include "hardware/gpio.h"
          #include "hardware/sync.h"
          #include "hardware/structs/ioqspi.h"
          #include "hardware/structs/sio.h"
          #include "helper.h"
          #include "config.pb.h"

          namespace {
              constexpr uint32_t MACRO_2_GPIO_MASK =
                  1u << 6;

              constexpr uint32_t MACRO_6_GPIO_MASK =
                  1u << 7;

              // Wait two seconds after firmware startup
              // before sending the automatic A sequence.
              constexpr uint64_t AUTO_A_START_DELAY_US =
                  2000000;

              // Start one A press every 500 milliseconds.
              constexpr uint64_t AUTO_A_INTERVAL_US =
                  500000;

              // Hold A for 120 milliseconds.
              constexpr uint64_t AUTO_A_HOLD_US =
                  120000;

              constexpr uint8_t AUTO_A_PRESS_COUNT =
                  3;

              // Read BOOTSEL at a limited frequency.
              constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
                  40000;

              constexpr uint64_t BOOTSEL_DEBOUNCE_US =
                  30000;

              uint64_t firmwareStartTime = 0;
              uint64_t lastBootselPollTime = 0;
              uint64_t bootselChangedTime = 0;

              bool rawBootselPressed = false;
              bool stableBootselPressed = false;

              // The first BOOTSEL press triggers Macro 6.
              uint32_t selectedMacroPin =
                  MACRO_6_GPIO_MASK;

              uint8_t autoAPressCount = 0;
          }

          bool __no_inline_not_in_flash_func(
              BootselButtonAddon::isBootselPressed
          )() {
              const uint CS_PIN_INDEX = 1;

              // Disable interrupts because flash access
              // is temporarily unavailable while reading
              // the RP2040 BOOTSEL button.
              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              // Do not call flash-resident delay functions
              // while QSPI chip select is overridden.
              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              // BOOTSEL is active low.
              bool buttonState =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              // Restore normal QSPI chip-select operation.
              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return buttonState;
          }

          bool BootselButtonAddon::available() {
              // Always load this addon because it provides
              // the automatic A sequence and BOOTSEL macro
              // switching.
              return true;
          }

          void BootselButtonAddon::setup() {
              const BootselButtonOptions& options =
                  Storage::getInstance()
                      .getAddonOptions()
                      .bootselButtonOptions;

              // Preserve the configured official BOOTSEL
              // button mapping.
              bootselButtonMap =
                  options.buttonMap;

              firmwareStartTime =
                  getMicro();

              lastBootselPollTime = 0;
              bootselChangedTime =
                  firmwareStartTime;

              rawBootselPressed = false;
              stableBootselPressed = false;

              selectedMacroPin =
                  MACRO_6_GPIO_MASK;

              autoAPressCount = 0;
          }

          void BootselButtonAddon::preprocess() {
              Gamepad* gamepad =
                  Storage::getInstance().GetGamepad();

              uint64_t now =
                  getMicro();

              uint64_t elapsed =
                  now - firmwareStartTime;

              /*
               * Automatic A sequence:
               *
               * 2.0 seconds: first A
               * 2.5 seconds: second A
               * 3.0 seconds: third A
               *
               * Each A press lasts 120 milliseconds.
               */
              if (
                  autoAPressCount <
                  AUTO_A_PRESS_COUNT
              ) {
                  uint64_t pressStart =
                      AUTO_A_START_DELAY_US +
                      (
                          static_cast<uint64_t>(
                              autoAPressCount
                          ) *
                          AUTO_A_INTERVAL_US
                      );

                  uint64_t pressEnd =
                      pressStart +
                      AUTO_A_HOLD_US;

                  if (
                      elapsed >= pressStart &&
                      elapsed < pressEnd
                  ) {
                      // GP2040-CE primary face button.
                      // In Nintendo Switch mode this is
                      // normally reported as A.
                      gamepad->state.buttons |=
                          GAMEPAD_MASK_B1;
                  }

                  if (elapsed >= pressEnd) {
                      autoAPressCount++;
                  }
              }

              /*
               * BOOTSEL polling and debounce.
               */
              bool shouldPoll =
                  lastBootselPollTime == 0 ||
                  now - lastBootselPollTime >=
                      BOOTSEL_POLL_INTERVAL_US;

              if (shouldPoll) {
                  lastBootselPollTime =
                      now;

                  bool currentRawPressed =
                      isBootselPressed();

                  if (
                      currentRawPressed !=
                      rawBootselPressed
                  ) {
                      rawBootselPressed =
                          currentRawPressed;

                      bootselChangedTime =
                          now;
                  }

                  bool debounceComplete =
                      now - bootselChangedTime >=
                      BOOTSEL_DEBOUNCE_US;

                  if (
                      debounceComplete &&
                      stableBootselPressed !=
                          rawBootselPressed
                  ) {
                      stableBootselPressed =
                          rawBootselPressed;

                      /*
                       * Switch to the next macro only
                       * after BOOTSEL is released.
                       *
                       * First press:  Macro 6
                       * Second press: Macro 2
                       * Third press:  Macro 6
                       */
                      if (!stableBootselPressed) {
                          if (
                              selectedMacroPin ==
                              MACRO_6_GPIO_MASK
                          ) {
                              selectedMacroPin =
                                  MACRO_2_GPIO_MASK;
                          } else {
                              selectedMacroPin =
                                  MACRO_6_GPIO_MASK;
                          }
                      }
                  }
              }

              /*
               * Preserve the official BOOTSEL button
               * mapping when one is configured.
               */
              if (
                  stableBootselPressed &&
                  bootselButtonMap != 0
              ) {
                  switch (bootselButtonMap) {
                      case GAMEPAD_MASK_DU:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_UP;
                          break;

                      case GAMEPAD_MASK_DD:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_DOWN;
                          break;

                      case GAMEPAD_MASK_DL:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_LEFT;
                          break;

                      case GAMEPAD_MASK_DR:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_RIGHT;
                          break;

                      default:
                          gamepad->state.buttons |=
                              bootselButtonMap;
                          break;
                  }
              }

              /*
               * GP6 and GP7 are virtual macro inputs:
               *
               * GP6 = Macro 2
               * GP7 = Macro 6
               *
               * Clear their physical GPIO states first.
               */
              const uint32_t bothMacroPins =
                  MACRO_2_GPIO_MASK |
                  MACRO_6_GPIO_MASK;

              gamepad->debouncedGpio &=
                  ~bothMacroPins;

              // Present exactly one virtual macro input
              // while BOOTSEL is pressed.
              if (stableBootselPressed) {
                  gamepad->debouncedGpio |=
                      selectedMacroPin;
              }
          }
          CPP

          echo "BOOTSEL bridge and automatic A sequence installed"

      - name: Verify BOOTSEL and automatic A patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/bootsel_button.cpp
          test -f src/addons/input_macro.cpp

          grep -q \
            "BootselButtonAddon::isBootselPressed" \
            src/addons/bootsel_button.cpp

          grep -q \
            "save_and_disable_interrupts" \
            src/addons/bootsel_button.cpp

          grep -q \
            "restore_interrupts(flags)" \
            src/addons/bootsel_button.cpp

          grep -q \
            "GAMEPAD_MASK_B1" \
            src/addons/bootsel_button.cpp

          grep -q \
            "AUTO_A_PRESS_COUNT" \
            src/addons/bootsel_button.cpp

          grep -q \
            "AUTO_A_INTERVAL_US" \
            src/addons/bootsel_button.cpp

          grep -q \
            "AUTO_A_HOLD_US" \
            src/addons/bootsel_button.cpp

          grep -q \
            "MACRO_2_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q \
            "MACRO_6_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q \
            "gamepad->debouncedGpio" \
            src/addons/bootsel_button.cpp

          grep -q \
            "InputMacro::runCurrentMacro" \
            src/addons/input_macro.cpp

          echo "BOOTSEL and automatic A patch verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated UF2
        id: find-uf2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"

            find gp2040-ce/build \
              -type f \
              | sort

            exit 1
          fi

          echo "Generated UF2:"
          echo "$UF2_FILE"

          echo "uf2_file=$UF2_FILE" \
            >> "$GITHUB_OUTPUT"

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="${{ steps.find-uf2.outputs.uf2_file }}"

          if [ -z "$UF2_FILE" ]; then
            echo "UF2 output path is empty"
            exit 1
          fi

          test -f "$UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-Pico-Switch2-AutoA-Macro2-Macro6.uf2

          sha256sum \
            GP2040-CE-Pico-Switch2-AutoA-Macro2-Macro6.uf2 \
            > SHA256SUMS.txt

          echo "Packaged files:"
          ls -lh \
            GP2040-CE-Pico-Switch2-AutoA-Macro2-Macro6.uf2 \
            SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-Switch2-AutoA-Macro2-Macro6
          path: |
            GP2040-CE-Pico-Switch2-AutoA-Macro2-Macro6.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
