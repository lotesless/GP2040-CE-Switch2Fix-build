name: Build GP2040-CE v0.7.12 Switch 2 Fix Direct BOOTSEL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK verified:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Generated web filesystem:"
          ls -lh lib/httpd/fsdata.c

      - name: Apply direct BOOTSEL macro and automatic A patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          macro_file = Path("src/addons/input_macro.cpp")
          bootsel_file = Path("src/addons/bootsel_button.cpp")

          if not macro_file.is_file():
              raise SystemExit(
                  "src/addons/input_macro.cpp was not found"
              )

          if not bootsel_file.is_file():
              raise SystemExit(
                  "src/addons/bootsel_button.cpp was not found"
              )

          source = macro_file.read_text(
              encoding="utf-8"
          )

          source = source.replace(
              "\r\n",
              "\n",
          ).replace(
              "\r",
              "\n",
          )

          if "namespace Switch2FixSupport" in source:
              raise SystemExit(
                  "Switch2FixSupport was already inserted"
              )

          gpio_include = '#include "hardware/gpio.h"'

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          if gpio_include not in source:
              raise SystemExit(
                  "hardware/gpio.h include was not found"
              )

          missing_includes = [
              include_line
              for include_line in required_includes
              if include_line not in source
          ]

          if missing_includes:
              include_block = (
                  gpio_include
                  + "\n"
                  + "\n".join(missing_includes)
              )

              source = source.replace(
                  gpio_include,
                  include_block,
                  1,
              )

          available_pattern = re.compile(
              r"bool\s+InputMacro::available\s*"
              r"\(\s*\)\s*\{.*?^\}",
              re.MULTILINE | re.DOTALL,
          )

          available_matches = list(
              available_pattern.finditer(source)
          )

          if len(available_matches) != 1:
              raise SystemExit(
                  "Expected exactly one "
                  "InputMacro::available(), "
                  f"found {len(available_matches)}"
              )

          new_available = '''bool InputMacro::available() {
              // BOOTSEL and automatic A require this addon
              // to remain active regardless of GPIO state.
              return true;
          }'''

          source = available_pattern.sub(
              new_available,
              source,
              count=1,
          )

          setup_pattern = re.compile(
              r"^[ \t]*void\s+InputMacro::setup\s*"
              r"\(\s*\)\s*\{",
              re.MULTILINE,
          )

          setup_match = setup_pattern.search(source)

          if setup_match is None:
              raise SystemExit(
                  "InputMacro::setup() was not found"
              )

          helper_code = r'''
          namespace Switch2FixSupport {

          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;

          constexpr uint64_t BOOTSEL_START_DELAY_US =
              1000000;

          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              20000;

          constexpr uint64_t BOOTSEL_DEBOUNCE_US =
              30000;

          constexpr uint64_t AUTO_A_START_DELAY_US =
              2000000;

          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          constexpr int AUTO_A_PRESS_COUNT = 3;

          uint64_t bootselStartTime = 0;
          uint64_t bootselLastPollTime = 0;
          uint64_t bootselChangedTime = 0;

          bool bootselRawPressed = false;
          bool bootselStablePressed = false;
          bool bootselPressEvent = false;

          int selectedMacroIndex =
              MACRO_6_INDEX;

          uint64_t autoAStartTime = 0;
          int autoAPressCount = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (
                  volatile int delay = 0;
                  delay < 1000;
                  ++delay
              ) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void updateBootselButton() {
              uint64_t now = getMicro();

              if (bootselStartTime == 0) {
                  bootselStartTime = now;
                  bootselLastPollTime = now;
                  bootselChangedTime = now;
                  return;
              }

              if (
                  now - bootselStartTime <
                  BOOTSEL_START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - bootselLastPollTime <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollTime = now;

              bool rawPressed =
                  readBootselButton();

              if (
                  rawPressed !=
                  bootselRawPressed
              ) {
                  bootselRawPressed =
                      rawPressed;

                  bootselChangedTime = now;
              }

              if (
                  bootselRawPressed !=
                      bootselStablePressed &&
                  now - bootselChangedTime >=
                      BOOTSEL_DEBOUNCE_US
              ) {
                  bootselStablePressed =
                      bootselRawPressed;

                  if (bootselStablePressed) {
                      bootselPressEvent = true;
                  }
              }
          }

          bool hasBootselPressEvent() {
              return bootselPressEvent;
          }

          void discardBootselPressEvent() {
              bootselPressEvent = false;
          }

          int getSelectedMacroIndex() {
              return selectedMacroIndex;
          }

          void selectNextMacro() {
              selectedMacroIndex =
                  selectedMacroIndex ==
                      MACRO_6_INDEX
                      ? MACRO_2_INDEX
                      : MACRO_6_INDEX;
          }

          void runAutomaticASequence(
              Gamepad* gamepad
          ) {
              uint64_t now = getMicro();

              if (autoAStartTime == 0) {
                  autoAStartTime = now;
                  return;
              }

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  return;
              }

              uint64_t elapsed =
                  now - autoAStartTime;

              uint64_t pressStart =
                  AUTO_A_START_DELAY_US +
                  (
                      static_cast<uint64_t>(
                          autoAPressCount
                      ) *
                      AUTO_A_INTERVAL_US
                  );

              uint64_t pressEnd =
                  pressStart +
                  AUTO_A_HOLD_US;

              if (
                  elapsed >= pressStart &&
                  elapsed < pressEnd
              ) {
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B1;
              }

              if (elapsed >= pressEnd) {
                  ++autoAPressCount;
              }
          }

          }
          '''

          source = (
              source[:setup_match.start()]
              + helper_code.strip()
              + "\n\n"
              + source[setup_match.start():]
          )

          check_press_start_pattern = re.compile(
              r"^[ \t]*void\s+"
              r"InputMacro::checkMacroPress\s*"
              r"\(\s*\)\s*\{",
              re.MULTILINE,
          )

          check_action_start_pattern = re.compile(
              r"^[ \t]*void\s+"
              r"InputMacro::checkMacroAction\s*"
              r"\(\s*\)\s*\{",
              re.MULTILINE,
          )

          check_press_match = (
              check_press_start_pattern.search(source)
          )

          check_action_match = (
              check_action_start_pattern.search(source)
          )

          if check_press_match is None:
              raise SystemExit(
                  "InputMacro::checkMacroPress() "
                  "was not found"
              )

          if check_action_match is None:
              raise SystemExit(
                  "InputMacro::checkMacroAction() "
                  "was not found"
              )

          if (
              check_action_match.start() <=
              check_press_match.start()
          ):
              raise SystemExit(
                  "Unexpected macro function order"
              )

          new_check_press = '''void InputMacro::checkMacroPress() {
              Switch2FixSupport::updateBootselButton();

              pressedMacro = -1;

              if (
                  !Switch2FixSupport::
                      hasBootselPressEvent()
              ) {
                  return;
              }

              if (isMacroRunning) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              const int candidateMacro =
                  Switch2FixSupport::
                      getSelectedMacroIndex();

              if (
                  candidateMacro < 0 ||
                  candidateMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              Macro& macro =
                  inputMacroOptions
                      ->macroList[candidateMacro];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              pressedMacro = candidateMacro;
          }

          '''

          source = (
              source[:check_press_match.start()]
              + new_check_press
              + source[check_action_match.start():]
          )

          check_action_match = (
              check_action_start_pattern.search(source)
          )

          run_current_pattern = re.compile(
              r"^[ \t]*void\s+"
              r"InputMacro::runCurrentMacro\s*"
              r"\(\s*\)\s*\{",
              re.MULTILINE,
          )

          run_current_match = (
              run_current_pattern.search(source)
          )

          if check_action_match is None:
              raise SystemExit(
                  "InputMacro::checkMacroAction() "
                  "was lost during patching"
              )

          if run_current_match is None:
              raise SystemExit(
                  "InputMacro::runCurrentMacro() "
                  "was not found"
              )

          if (
              run_current_match.start() <=
              check_action_match.start()
          ):
              raise SystemExit(
                  "Unexpected checkMacroAction/"
                  "runCurrentMacro order"
              )

          original_run_current_and_after = (
              source[run_current_match.start():]
          )

          new_check_action = '''void InputMacro::checkMacroAction() {
              if (
                  !Switch2FixSupport::
                      hasBootselPressEvent()
              ) {
                  return;
              }

              Switch2FixSupport::
                  discardBootselPressEvent();

              if (
                  isMacroRunning ||
                  pressedMacro < 0 ||
                  pressedMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  pressedMacro = -1;
                  return;
              }

              macroPosition = pressedMacro;
              macroInputPosition = 0;
              isMacroTriggerHeld = true;
              prevMacroInputPressed = false;

              Macro& macro =
                  inputMacroOptions
                      ->macroList[macroPosition];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  reset();
                  return;
              }

              // A BOOTSEL press always executes one sequence.
              // This prevents Toggle or Hold Repeat settings
              // from keeping the macro active indefinitely.
              macro.macroType = ON_PRESS;

              MacroInput& macroInput =
                  macro.macroInputs[0];

              uint32_t macroInputDuration =
                  macroInput.duration +
                  macroInput.waitDuration;

              macroInputHoldTime =
                  macroInputDuration <= 0
                      ? INPUT_HOLD_US
                      : macroInputDuration;

              isMacroRunning = true;
              macroStartTime = getMicro();

              Switch2FixSupport::
                  selectNextMacro();
          }

          '''

          source = (
              source[:check_action_match.start()]
              + new_check_action
              + source[run_current_match.start():]
          )

          if original_run_current_and_after not in source:
              raise SystemExit(
                  "Official runCurrentMacro() content "
                  "was unexpectedly modified"
              )

          preprocess_pattern = re.compile(
              r"^(?P<indent>[ \t]*)"
              r"void\s+InputMacro::preprocess\s*"
              r"\(\s*\)\s*"
              r"(?:\n[ \t]*)?"
              r"\{[ \t]*\n",
              re.MULTILINE,
          )

          preprocess_matches = list(
              preprocess_pattern.finditer(source)
          )

          if len(preprocess_matches) != 1:
              raise SystemExit(
                  "Expected exactly one "
                  "InputMacro::preprocess(), "
                  f"found {len(preprocess_matches)}"
              )

          preprocess_match = preprocess_matches[0]

          body_indent = (
              preprocess_match.group("indent")
              + "    "
          )

          auto_a_block = (
              f"{body_indent}"
              "Gamepad* switch2FixGamepad =\n"
              f"{body_indent}    "
              "Storage::getInstance().GetGamepad();\n"
              "\n"
              f"{body_indent}"
              "Switch2FixSupport::"
              "runAutomaticASequence(\n"
              f"{body_indent}    "
              "switch2FixGamepad\n"
              f"{body_indent}"
              ");\n"
              "\n"
          )

          insertion_position = (
              preprocess_match.end()
          )

          source = (
              source[:insertion_position]
              + auto_a_block
              + source[insertion_position:]
          )

          macro_file.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          disabled_bootsel_source = '''\
          #include "addons/bootsel_button.h"

          bool BootselButtonAddon::available() {
              return false;
          }

          void BootselButtonAddon::setup() {
          }

          void BootselButtonAddon::preprocess() {
          }
          '''

          bootsel_file.write_text(
              disabled_bootsel_source,
              encoding="utf-8",
              newline="\n",
          )

          print(
              "Direct BOOTSEL macro patch applied"
          )
          print(
              "InputMacro addon is forced available"
          )
          print(
              "First BOOTSEL press: Macro 6"
          )
          print(
              "Second BOOTSEL press: Macro 2"
          )
          print(
              "Original runCurrentMacro() preserved"
          )
          print(
              "Automatic A starts after 2000 ms"
          )
          print(
              "Automatic A count: 3"
          )
          PY

      - name: Verify patched C++ source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MACRO_FILE="src/addons/input_macro.cpp"
          BOOTSEL_FILE="src/addons/bootsel_button.cpp"

          test -f "$INPUT_MACRO_FILE"
          test -f "$BOOTSEL_FILE"

          test "$(
            grep -c \
              "namespace Switch2FixSupport" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "bool InputMacro::available" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroPress" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroAction" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::runCurrentMacro" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::preprocess" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          grep -q \
            "readBootselButton" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "save_and_disable_interrupts" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "restore_interrupts(flags)" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_START_DELAY_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_POLL_INTERVAL_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_DEBOUNCE_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "selectedMacroIndex" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_2_INDEX = 1" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_6_INDEX = 5" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "macro.macroType = ON_PRESS" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_START_DELAY_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_INTERVAL_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_HOLD_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_PRESS_COUNT" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "GAMEPAD_MASK_B1" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "bool BootselButtonAddon::available" \
            "$BOOTSEL_FILE"

          grep -q \
            "return false" \
            "$BOOTSEL_FILE"

          if grep -q \
            "restore_interrupts_from_disabled" \
            "$INPUT_MACRO_FILE"; then
            echo "Unsupported interrupt restore function found"
            exit 1
          fi

          if grep -q \
            "allPins |= macroPinMasks" \
            "$INPUT_MACRO_FILE"; then
            echo "Old virtual GPIO trigger logic found"
            exit 1
          fi

          if grep -q \
            "InputMacro trigger block not found" \
            "$INPUT_MACRO_FILE"; then
            echo "Old failed patch text found"
            exit 1
          fi

          echo "Patched source verification passed"

          echo
          echo "InputMacro availability:"
          grep \
            -n \
            -A 8 \
            "bool InputMacro::available" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Direct BOOTSEL checkMacroPress:"
          grep \
            -n \
            -A 70 \
            "void InputMacro::checkMacroPress" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Direct BOOTSEL checkMacroAction:"
          grep \
            -n \
            -A 85 \
            "void InputMacro::checkMacroAction" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Automatic A preprocess call:"
          grep \
            -n \
            -A 18 \
            -B 5 \
            "runAutomaticASequence" \
            "$INPUT_MACRO_FILE" \
            | tail -n 30

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"
          test -f lib/httpd/fsdata.c

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated Pico UF2
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_UF2="gp2040-ce/build/GP2040-CE_0.7.12_Pico.uf2"

          if [ -f "$EXPECTED_UF2" ]; then
            UF2_FILE="$EXPECTED_UF2"
          else
            UF2_FILE="$(
              find gp2040-ce/build \
                -type f \
                -name "GP2040-CE_*_Pico.uf2" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "${UF2_FILE:-}" ]; then
            echo "Pico UF2 file was not generated"

            find gp2040-ce/build \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          test -f "$UF2_FILE"
          test -s "$UF2_FILE"

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Selected UF2:"
          echo "$UF2_FILE"

      - name: Package direct BOOTSEL firmware
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

          OUTPUT_FILE="GP2040-CE-v0.7.12-Switch2-Direct-BOOTSEL-AutoA.uf2"

          cp \
            "$UF2_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          sha256sum \
            "$OUTPUT_FILE" \
            > SHA256SUMS.txt

          echo "Firmware package created:"
          ls -lh \
            "$OUTPUT_FILE" \
            SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-v0.7.12-Switch2-Direct-BOOTSEL-AutoA
          path: |
            GP2040-CE-v0.7.12-Switch2-Direct-BOOTSEL-AutoA.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
