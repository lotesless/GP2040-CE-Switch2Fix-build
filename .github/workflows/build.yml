name: Build GP2040-CE v0.7.12 Switch 2 Stable BOOTSEL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK verified:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Generated web filesystem:"
          ls -lh lib/httpd/fsdata.c

      - name: Apply stable BOOTSEL and Switch A patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          macro_file = Path(
              "src/addons/input_macro.cpp"
          )

          bootsel_file = Path(
              "src/addons/bootsel_button.cpp"
          )

          if not macro_file.is_file():
              raise SystemExit(
                  "src/addons/input_macro.cpp was not found"
              )

          if not bootsel_file.is_file():
              raise SystemExit(
                  "src/addons/bootsel_button.cpp was not found"
              )

          source = macro_file.read_text(
              encoding="utf-8"
          )

          source = source.replace(
              "\r\n",
              "\n",
          ).replace(
              "\r",
              "\n",
          )

          if "namespace Switch2FixSupport" in source:
              raise SystemExit(
                  "Switch2FixSupport was already inserted"
              )

          def find_function_span(
              text,
              return_type,
              qualified_name,
          ):
              signature_pattern = re.compile(
                  (
                      r"^[ \t]*"
                      + re.escape(return_type)
                      + r"[ \t]+"
                      + re.escape(qualified_name)
                      + r"[ \t]*\([ \t\r\n]*\)"
                  ),
                  re.MULTILINE,
              )

              matches = list(
                  signature_pattern.finditer(text)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "Expected exactly one "
                      + qualified_name
                      + " function, found "
                      + str(len(matches))
                  )

              match = matches[0]

              opening_brace = text.find(
                  "{",
                  match.end(),
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Opening brace for "
                      + qualified_name
                      + " was not found"
                  )

              between_signature_and_brace = text[
                  match.end():opening_brace
              ]

              if between_signature_and_brace.strip():
                  raise SystemExit(
                      "Unexpected text between "
                      + qualified_name
                      + " signature and opening brace"
                  )

              depth = 0
              closing_brace = -1

              for position in range(
                  opening_brace,
                  len(text),
              ):
                  character = text[position]

                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          closing_brace = position
                          break

              if closing_brace < 0:
                  raise SystemExit(
                      "Closing brace for "
                      + qualified_name
                      + " was not found"
                  )

              return (
                  match.start(),
                  closing_brace + 1,
              )

          def replace_function(
              text,
              return_type,
              qualified_name,
              replacement,
          ):
              start, end = find_function_span(
                  text,
                  return_type,
                  qualified_name,
              )

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          gpio_include = (
              '#include "hardware/gpio.h"'
          )

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "tusb.h"',
          ]

          if gpio_include not in source:
              raise SystemExit(
                  "hardware/gpio.h include was not found"
              )

          missing_includes = [
              include_line
              for include_line in required_includes
              if include_line not in source
          ]

          if missing_includes:
              include_block = (
                  gpio_include
                  + "\n"
                  + "\n".join(missing_includes)
              )

              source = source.replace(
                  gpio_include,
                  include_block,
                  1,
              )

          new_available = r'''
          bool InputMacro::available() {
              // The automatic Switch A sequence and BOOTSEL
              // macro trigger require this addon to stay loaded.
              return true;
          }
          '''

          source = replace_function(
              source,
              "bool",
              "InputMacro::available",
              new_available,
          )

          setup_start, setup_end = find_function_span(
              source,
              "void",
              "InputMacro::setup",
          )

          helper_code = r'''
          namespace Switch2FixSupport {

          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;

          // Wait until USB is mounted before generating
          // any automatic controller input.
          constexpr uint64_t AUTO_A_AFTER_MOUNT_US =
              4000000;

          // Reading BOOTSEL temporarily manipulates the QSPI
          // flash chip-select line. Delay polling until after
          // the Switch 2 connection has become stable.
          constexpr uint64_t BOOTSEL_AFTER_MOUNT_US =
              5000000;

          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              10000;

          constexpr uint64_t BOOTSEL_RELEASE_DEBOUNCE_US =
              30000;

          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          constexpr int AUTO_A_PRESS_COUNT = 3;

          bool usbWasMounted = false;
          uint64_t usbMountedAt = 0;

          uint64_t bootselLastPollAt = 0;
          uint64_t bootselReleaseStartedAt = 0;

          bool bootselPressLocked = false;
          bool bootselPressEvent = false;

          int selectedMacroIndex =
              MACRO_6_INDEX;

          int autoAPressCount = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (
                  volatile int delay = 0;
                  delay < 1000;
                  ++delay
              ) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void resetConnectionSession() {
              usbMountedAt = 0;

              bootselLastPollAt = 0;
              bootselReleaseStartedAt = 0;
              bootselPressLocked = false;
              bootselPressEvent = false;

              selectedMacroIndex =
                  MACRO_6_INDEX;

              autoAPressCount = 0;
          }

          void updateUsbConnection() {
              bool mounted = tud_mounted();
              uint64_t now = getMicro();

              if (!mounted) {
                  if (usbWasMounted) {
                      resetConnectionSession();
                  }

                  usbWasMounted = false;
                  return;
              }

              if (!usbWasMounted) {
                  resetConnectionSession();

                  usbWasMounted = true;
                  usbMountedAt = now;
              }
          }

          bool hasMountedFor(
              uint64_t duration
          ) {
              if (
                  !usbWasMounted ||
                  usbMountedAt == 0
              ) {
                  return false;
              }

              return (
                  getMicro() - usbMountedAt >=
                  duration
              );
          }

          void updateBootselButton(
              bool macroIsRunning
          ) {
              if (
                  !hasMountedFor(
                      BOOTSEL_AFTER_MOUNT_US
                  )
              ) {
                  return;
              }

              uint64_t now = getMicro();

              if (
                  now - bootselLastPollAt <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollAt = now;

              bool pressed =
                  readBootselButton();

              if (pressed) {
                  bootselReleaseStartedAt = 0;

                  // Lock the event immediately when any
                  // pressed sample is observed. This makes
                  // short presses much easier to capture.
                  if (!bootselPressLocked) {
                      bootselPressLocked = true;

                      if (!macroIsRunning) {
                          bootselPressEvent = true;
                      }
                  }

                  return;
              }

              if (!bootselPressLocked) {
                  return;
              }

              if (
                  bootselReleaseStartedAt == 0
              ) {
                  bootselReleaseStartedAt = now;
                  return;
              }

              if (
                  now - bootselReleaseStartedAt >=
                  BOOTSEL_RELEASE_DEBOUNCE_US
              ) {
                  bootselPressLocked = false;
                  bootselReleaseStartedAt = 0;
              }
          }

          bool hasBootselPressEvent() {
              return bootselPressEvent;
          }

          void discardBootselPressEvent() {
              bootselPressEvent = false;
          }

          int getSelectedMacroIndex() {
              return selectedMacroIndex;
          }

          void selectNextMacro() {
              selectedMacroIndex =
                  selectedMacroIndex ==
                      MACRO_6_INDEX
                      ? MACRO_2_INDEX
                      : MACRO_6_INDEX;
          }

          void runAutomaticASequence(
              Gamepad* gamepad
          ) {
              if (
                  !hasMountedFor(
                      AUTO_A_AFTER_MOUNT_US
                  )
              ) {
                  return;
              }

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  return;
              }

              uint64_t elapsed =
                  getMicro() -
                  (
                      usbMountedAt +
                      AUTO_A_AFTER_MOUNT_US
                  );

              uint64_t pressStart =
                  static_cast<uint64_t>(
                      autoAPressCount
                  ) *
                  AUTO_A_INTERVAL_US;

              uint64_t pressEnd =
                  pressStart +
                  AUTO_A_HOLD_US;

              if (
                  elapsed >= pressStart &&
                  elapsed < pressEnd
              ) {
                  // GP2040-CE SwitchProDriver mapping:
                  // pressedB2() becomes Nintendo Switch A.
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B2;
              }

              if (elapsed >= pressEnd) {
                  ++autoAPressCount;
              }
          }

          }
          '''

          source = (
              source[:setup_start]
              + helper_code.strip()
              + "\n\n"
              + source[setup_start:]
          )

          new_check_press = r'''
          void InputMacro::checkMacroPress() {
              Switch2FixSupport::updateBootselButton(
                  isMacroRunning
              );

              pressedMacro = -1;

              if (
                  !Switch2FixSupport::
                      hasBootselPressEvent()
              ) {
                  return;
              }

              if (isMacroRunning) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              const int candidateMacro =
                  Switch2FixSupport::
                      getSelectedMacroIndex();

              if (
                  candidateMacro < 0 ||
                  candidateMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              Macro& candidate =
                  inputMacroOptions
                      ->macroList[candidateMacro];

              if (
                  !candidate.enabled ||
                  candidate.macroInputs_count == 0
              ) {
                  Switch2FixSupport::
                      discardBootselPressEvent();

                  return;
              }

              pressedMacro = candidateMacro;
          }
          '''

          source = replace_function(
              source,
              "void",
              "InputMacro::checkMacroPress",
              new_check_press,
          )

          new_check_action = r'''
          void InputMacro::checkMacroAction() {
              if (
                  !Switch2FixSupport::
                      hasBootselPressEvent()
              ) {
                  return;
              }

              Switch2FixSupport::
                  discardBootselPressEvent();

              if (
                  isMacroRunning ||
                  pressedMacro < 0 ||
                  pressedMacro >=
                      MAX_MACRO_LIMIT
              ) {
                  pressedMacro = -1;
                  return;
              }

              macroPosition = pressedMacro;
              macroInputPosition = 0;
              isMacroTriggerHeld = true;
              prevMacroInputPressed = false;

              Macro& macro =
                  inputMacroOptions
                      ->macroList[macroPosition];

              if (
                  !macro.enabled ||
                  macro.macroInputs_count == 0
              ) {
                  reset();
                  return;
              }

              // A BOOTSEL press always runs one complete
              // macro sequence.
              macro.macroType = ON_PRESS;

              MacroInput& macroInput =
                  macro.macroInputs[0];

              uint32_t macroInputDuration =
                  macroInput.duration +
                  macroInput.waitDuration;

              macroInputHoldTime =
                  macroInputDuration <= 0
                      ? INPUT_HOLD_US
                      : macroInputDuration;

              isMacroRunning = true;
              macroStartTime = getMicro();

              // Change to the other macro only after the
              // current macro was successfully started.
              Switch2FixSupport::
                  selectNextMacro();
          }
          '''

          source = replace_function(
              source,
              "void",
              "InputMacro::checkMacroAction",
              new_check_action,
          )

          new_preprocess = r'''
          void InputMacro::preprocess()
          {
              Switch2FixSupport::
                  updateUsbConnection();

              FocusModeOptions* focusModeOptions =
                  &Storage::getInstance()
                      .getAddonOptions()
                      .focusModeOptions;

              if (
                  focusModeOptions->enabled &&
                  focusModeOptions
                      ->macroLockEnabled
              ) {
                  Gamepad* gamepad =
                      Storage::getInstance()
                          .GetGamepad();

                  if (
                      focusModeOptions
                          ->overrideEnabled ||
                      (
                          gamepad
                              ->mapFocusMode
                              ->pinMask &&
                          (
                              gamepad
                                  ->debouncedGpio &
                              gamepad
                                  ->mapFocusMode
                                  ->pinMask
                          )
                      )
                  ) {
                      return;
                  }
              }

              checkMacroPress();
              checkMacroAction();
              runCurrentMacro();

              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              Switch2FixSupport::
                  runAutomaticASequence(gamepad);
          }
          '''

          source = replace_function(
              source,
              "void",
              "InputMacro::preprocess",
              new_preprocess,
          )

          macro_file.write_text(
              source,
              encoding="utf-8",
              newline="\n",
          )

          disabled_bootsel_source = '''\
          #include "addons/bootsel_button.h"

          bool BootselButtonAddon::available() {
              return false;
          }

          void BootselButtonAddon::setup() {
          }

          void BootselButtonAddon::preprocess() {
          }
          '''

          bootsel_file.write_text(
              disabled_bootsel_source,
              encoding="utf-8",
              newline="\n",
          )

          print(
              "Stable Switch 2 patch applied"
          )
          print(
              "Both preprocess brace styles are supported"
          )
          print(
              "Switch A mapping: GAMEPAD_MASK_B2"
          )
          print(
              "Automatic A starts 4 seconds after USB mount"
          )
          print(
              "BOOTSEL starts 5 seconds after USB mount"
          )
          print(
              "BOOTSEL polling interval: 10 ms"
          )
          print(
              "First BOOTSEL press: Macro 6"
          )
          print(
              "Second BOOTSEL press: Macro 2"
          )
          print(
              "Official runCurrentMacro() was preserved"
          )
          PY

      - name: Verify patched source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MACRO_FILE="src/addons/input_macro.cpp"
          BOOTSEL_FILE="src/addons/bootsel_button.cpp"

          test -f "$INPUT_MACRO_FILE"
          test -f "$BOOTSEL_FILE"

          test "$(
            grep -c \
              "namespace Switch2FixSupport" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "bool InputMacro::available" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::setup" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroPress" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::checkMacroAction" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::runCurrentMacro" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "void InputMacro::preprocess" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          grep -q \
            '#include "tusb.h"' \
            "$INPUT_MACRO_FILE"

          grep -q \
            "tud_mounted()" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "readBootselButton" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "save_and_disable_interrupts" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "restore_interrupts(flags)" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_AFTER_MOUNT_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_AFTER_MOUNT_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_POLL_INTERVAL_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "BOOTSEL_RELEASE_DEBOUNCE_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "GAMEPAD_MASK_B2" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_2_INDEX = 1" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_6_INDEX = 5" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "macro.macroType = ON_PRESS" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "bool BootselButtonAddon::available" \
            "$BOOTSEL_FILE"

          grep -q \
            "return false" \
            "$BOOTSEL_FILE"

          if grep -q \
            "GAMEPAD_MASK_B1" \
            "$INPUT_MACRO_FILE"; then
            echo "Wrong Switch B mapping was found"
            exit 1
          fi

          if grep -q \
            "restore_interrupts_from_disabled" \
            "$INPUT_MACRO_FILE"; then
            echo "Unsupported interrupt restore function found"
            exit 1
          fi

          if grep -q \
            "allPins |= macroPinMasks" \
            "$INPUT_MACRO_FILE"; then
            echo "Old virtual GPIO trigger logic found"
            exit 1
          fi

          if grep -q \
            "InputMacro::preprocess() was not found" \
            "$INPUT_MACRO_FILE"; then
            echo "Old Python error text found in source"
            exit 1
          fi

          echo "Patched source verification passed"

          echo
          echo "InputMacro function locations:"
          grep \
            -n \
            -E \
            "InputMacro::(available|setup|checkMacroPress|checkMacroAction|runCurrentMacro|preprocess)" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Verified Switch A mapping:"
          grep \
            -n \
            -A 5 \
            -B 5 \
            "GAMEPAD_MASK_B2" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Verified preprocess function:"
          grep \
            -n \
            -A 70 \
            "void InputMacro::preprocess" \
            "$INPUT_MACRO_FILE"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"
          test -f lib/httpd/fsdata.c

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated Pico UF2
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_UF2="gp2040-ce/build/GP2040-CE_0.7.12_Pico.uf2"

          if [ -f "$EXPECTED_UF2" ]; then
            UF2_FILE="$EXPECTED_UF2"
          else
            UF2_FILE="$(
              find gp2040-ce/build \
                -type f \
                -name "GP2040-CE_*_Pico.uf2" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "${UF2_FILE:-}" ]; then
            echo "Pico UF2 file was not generated"

            find gp2040-ce/build \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          test -f "$UF2_FILE"
          test -s "$UF2_FILE"

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Selected UF2:"
          echo "$UF2_FILE"

      - name: Package stable firmware
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

          OUTPUT_FILE="GP2040-CE-v0.7.12-Switch2-Stable-BOOTSEL-AutoA.uf2"

          cp \
            "$UF2_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          sha256sum \
            "$OUTPUT_FILE" \
            > SHA256SUMS.txt

          echo "Firmware package created:"
          ls -lh \
            "$OUTPUT_FILE" \
            SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-v0.7.12-Switch2-Stable-BOOTSEL-AutoA
          path: |
            GP2040-CE-v0.7.12-Switch2-Stable-BOOTSEL-AutoA.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
