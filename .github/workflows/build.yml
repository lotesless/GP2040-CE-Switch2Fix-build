name: Validate GP2040-CE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify source files
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          test -f src/addons/input_macro.cpp
          test -f CMakeLists.txt
          test -d "$GITHUB_WORKSPACE/pico-sdk"
          echo "Source and Pico SDK checks passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2

      - name: Locate UF2
        shell: bash
        run: |
          set -euo pipefail
          UF2_FILE="$(find gp2040-ce/build -type f -name '*.uf2' | head -n 1)"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"
            find gp2040-ce/build -type f | sort
            exit 1
          fi

          echo "Generated UF2: $UF2_FILE"
          cp "$UF2_FILE" GP2040-CE-Pico-validation.uf2
          sha256sum GP2040-CE-Pico-validation.uf2 > SHA256SUMS.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-validation
          path: |
            GP2040-CE-Pico-validation.uf2
            SHA256SUMS.txt
          if-no-files-found: error
