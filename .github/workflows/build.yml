name: Build Official GP2040-CE Pico

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build official web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify official web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "Official fsdata.c exists"

      - name: Verify official source is unmodified
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/bootsel_button.cpp
          test -f src/addons/input_macro.cpp
          test -f headers/addons/bootsel_button.h

          grep -q \
            "BootselButtonAddon::isBootselPressed" \
            src/addons/bootsel_button.cpp

          grep -q \
            "restore_interrupts(flags)" \
            src/addons/bootsel_button.cpp

          grep -q \
            "InputMacro::runCurrentMacro" \
            src/addons/input_macro.cpp

          if grep -q \
            "BootselMacroBridge" \
            src/addons/bootsel_button.cpp; then
            echo "Unexpected custom BOOTSEL patch detected"
            exit 1
          fi

          if grep -q \
            "readBootselForMacro" \
            src/addons/bootsel_button.cpp; then
            echo "Unexpected custom BOOTSEL reader detected"
            exit 1
          fi

          echo "Official source verification passed"

      - name: Configure official Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build official Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"

            find gp2040-ce/build \
              -type f \
              | sort

            exit 1
          fi

          echo "Generated official UF2:"
          echo "$UF2_FILE"

      - name: Package official UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"
            exit 1
          fi

          cp \
            "$UF2_FILE" \
            GP2040-CE-Official-v0.7.12-Pico.uf2

          sha256sum \
            GP2040-CE-Official-v0.7.12-Pico.uf2 \
            > SHA256SUMS.txt

      - name: Upload official UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Official-v0.7.12-Pico
          path: |
            GP2040-CE-Official-v0.7.12-Pico.uf2
            SHA256SUMS.txt
          if-no-files-found: error
