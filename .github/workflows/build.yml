name: Build GP2040-CE v0.7.12 Switch 2 Fix Auto A

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK found at:"
          echo "$GITHUB_WORKSPACE/pico-sdk"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "fsdata.c generated successfully"

      - name: Apply Switch 2 fix and automatic A patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          macro_file = Path("src/addons/input_macro.cpp")
          bootsel_file = Path("src/addons/bootsel_button.cpp")

          if not macro_file.is_file():
              raise SystemExit(
                  "src/addons/input_macro.cpp was not found"
              )

          if not bootsel_file.is_file():
              raise SystemExit(
                  "src/addons/bootsel_button.cpp was not found"
              )

          macro_source = macro_file.read_text(
              encoding="utf-8"
          )

          # Normalize line endings so generated patches are predictable.
          macro_source = macro_source.replace(
              "\r\n",
              "\n",
          ).replace(
              "\r",
              "\n",
          )

          gpio_include = '#include "hardware/gpio.h"'

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          if gpio_include not in macro_source:
              raise SystemExit(
                  "Cannot find hardware/gpio.h include"
              )

          missing_includes = [
              include_line
              for include_line in required_includes
              if include_line not in macro_source
          ]

          if missing_includes:
              include_block = (
                  gpio_include
                  + "\n"
                  + "\n".join(missing_includes)
              )

              macro_source = macro_source.replace(
                  gpio_include,
                  include_block,
                  1,
              )

          helper_marker = "namespace Switch2FixSupport"

          helper_code = r'''
          namespace Switch2FixSupport {

          constexpr uint64_t BOOTSEL_START_DELAY_US =
              1000000;

          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              20000;

          constexpr uint64_t BOOTSEL_DEBOUNCE_US =
              30000;

          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;

          constexpr uint64_t AUTO_A_START_DELAY_US =
              2000000;

          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          constexpr int AUTO_A_PRESS_COUNT = 3;

          uint64_t bootselStartTime = 0;
          uint64_t bootselLastPollTime = 0;
          uint64_t bootselChangedTime = 0;

          bool bootselRawState = false;
          bool bootselStableState = false;

          int nextMacroIndex = MACRO_6_INDEX;
          int pendingMacroIndex = -1;

          uint64_t autoAStartTime = 0;
          int autoAPressCount = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (
                  volatile int delay = 0;
                  delay < 1000;
                  ++delay
              ) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void updateBootselMacroSelector(
              bool acceptNewPress
          ) {
              uint64_t now = getMicro();

              if (bootselStartTime == 0) {
                  bootselStartTime = now;
                  bootselLastPollTime = now;
                  bootselChangedTime = now;
                  return;
              }

              if (
                  now - bootselStartTime <
                  BOOTSEL_START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - bootselLastPollTime <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollTime = now;

              bool rawState =
                  readBootselButton();

              if (rawState != bootselRawState) {
                  bootselRawState = rawState;
                  bootselChangedTime = now;
              }

              if (
                  rawState != bootselStableState &&
                  now - bootselChangedTime >=
                      BOOTSEL_DEBOUNCE_US
              ) {
                  bootselStableState = rawState;

                  if (
                      bootselStableState &&
                      acceptNewPress
                  ) {
                      pendingMacroIndex =
                          nextMacroIndex;

                      nextMacroIndex =
                          nextMacroIndex ==
                              MACRO_6_INDEX
                              ? MACRO_2_INDEX
                              : MACRO_6_INDEX;
                  }
              }
          }

          int takePendingMacroIndex() {
              int result = pendingMacroIndex;
              pendingMacroIndex = -1;
              return result;
          }

          void runAutomaticASequence(
              Gamepad* gamepad
          ) {
              uint64_t now = getMicro();

              if (autoAStartTime == 0) {
                  autoAStartTime = now;
                  return;
              }

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  return;
              }

              uint64_t elapsed =
                  now - autoAStartTime;

              uint64_t pressStart =
                  AUTO_A_START_DELAY_US +
                  (
                      static_cast<uint64_t>(
                          autoAPressCount
                      ) *
                      AUTO_A_INTERVAL_US
                  );

              uint64_t pressEnd =
                  pressStart +
                  AUTO_A_HOLD_US;

              if (
                  elapsed >= pressStart &&
                  elapsed < pressEnd
              ) {
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B1;
              }

              if (elapsed >= pressEnd) {
                  ++autoAPressCount;
              }
          }

          }
          '''

          if helper_marker in macro_source:
              raise SystemExit(
                  "Switch2FixSupport was already inserted"
              )

          available_pattern = re.compile(
              r"^[ \t]*bool[ \t]+"
              r"InputMacro::available[ \t]*"
              r"\([ \t]*\)",
              re.MULTILINE,
          )

          available_match = available_pattern.search(
              macro_source
          )

          if available_match is None:
              raise SystemExit(
                  "InputMacro::available() was not found"
              )

          macro_source = (
              macro_source[:available_match.start()]
              + helper_code.strip()
              + "\n\n"
              + macro_source[available_match.start():]
          )

          # Insert the BOOTSEL virtual macro trigger immediately
          # after the official allPins declaration. The original
          # macro loop and runCurrentMacro() remain unchanged.
          all_pins_pattern = re.compile(
              r"^(?P<indent>[ \t]*)"
              r"Mask_t[ \t]+allPins[ \t]*="
              r"[ \t]*gamepad->debouncedGpio"
              r"[ \t]*;[ \t]*\n",
              re.MULTILINE,
          )

          all_pins_matches = list(
              all_pins_pattern.finditer(macro_source)
          )

          if len(all_pins_matches) != 1:
              raise SystemExit(
                  "Expected exactly one allPins declaration "
                  "inside InputMacro::checkMacroPress(), "
                  f"found {len(all_pins_matches)}"
              )

          all_pins_match = all_pins_matches[0]
          body_indent = all_pins_match.group("indent")

          bootsel_trigger_block = (
              f"{body_indent}"
              "Switch2FixSupport::"
              "updateBootselMacroSelector("
              "!isMacroRunning);\n"
              "\n"
              f"{body_indent}"
              "const int bootselMacroIndex =\n"
              f"{body_indent}    "
              "Switch2FixSupport::"
              "takePendingMacroIndex();\n"
              "\n"
              f"{body_indent}"
              "if (\n"
              f"{body_indent}    "
              "bootselMacroIndex >= 0 &&\n"
              f"{body_indent}    "
              "bootselMacroIndex < MAX_MACRO_LIMIT &&\n"
              f"{body_indent}    "
              "macroPinMasks[bootselMacroIndex] != 0\n"
              f"{body_indent}"
              ") {\n"
              f"{body_indent}    "
              "allPins |= "
              "macroPinMasks[bootselMacroIndex];\n"
              f"{body_indent}"
              "}\n"
          )

          insertion_position = all_pins_match.end()

          macro_source = (
              macro_source[:insertion_position]
              + "\n"
              + bootsel_trigger_block
              + macro_source[insertion_position:]
          )

          # Insert automatic A at the start of preprocess().
          # This keeps the official checkMacroPress(),
          # checkMacroAction(), and runCurrentMacro() sequence.
          preprocess_pattern = re.compile(
              r"^(?P<indent>[ \t]*)"
              r"void[ \t]+InputMacro::preprocess"
              r"[ \t]*\([ \t]*\)[ \t]*"
              r"(?:\n[ \t]*)?"
              r"\{[ \t]*\n",
              re.MULTILINE,
          )

          preprocess_matches = list(
              preprocess_pattern.finditer(macro_source)
          )

          if len(preprocess_matches) != 1:
              raise SystemExit(
                  "Expected exactly one "
                  "InputMacro::preprocess(), "
                  f"found {len(preprocess_matches)}"
              )

          preprocess_match = preprocess_matches[0]
          preprocess_body_indent = (
              preprocess_match.group("indent")
              + "    "
          )

          auto_a_block = (
              f"{preprocess_body_indent}"
              "Gamepad* switch2FixGamepad =\n"
              f"{preprocess_body_indent}    "
              "Storage::getInstance().GetGamepad();\n"
              "\n"
              f"{preprocess_body_indent}"
              "Switch2FixSupport::"
              "runAutomaticASequence(\n"
              f"{preprocess_body_indent}    "
              "switch2FixGamepad\n"
              f"{preprocess_body_indent}"
              ");\n"
          )

          preprocess_insertion_position = (
              preprocess_match.end()
          )

          macro_source = (
              macro_source[
                  :preprocess_insertion_position
              ]
              + auto_a_block
              + "\n"
              + macro_source[
                  preprocess_insertion_position:
              ]
          )

          macro_file.write_text(
              macro_source,
              encoding="utf-8",
              newline="\n",
          )

          # Disable the original BOOTSEL addon because BOOTSEL
          # is now sampled from input_macro.cpp.
          disabled_bootsel_source = '''\
          #include "addons/bootsel_button.h"

          bool BootselButtonAddon::available() {
              return false;
          }

          void BootselButtonAddon::setup() {
          }

          void BootselButtonAddon::preprocess() {
          }
          '''

          bootsel_file.write_text(
              disabled_bootsel_source,
              encoding="utf-8",
              newline="\n",
          )

          print("Switch 2 patch applied successfully")
          print("Original runCurrentMacro() was preserved")
          print("First BOOTSEL press selects Macro 6")
          print("Second BOOTSEL press selects Macro 2")
          print("BOOTSEL start delay: 1000 ms")
          print("BOOTSEL poll interval: 20 ms")
          print("BOOTSEL debounce: 30 ms")
          print("Automatic A start delay: 2000 ms")
          print("Automatic A press count: 3")
          print("Automatic A interval: 500 ms")
          print("Automatic A hold duration: 120 ms")
          PY

      - name: Verify patched source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          INPUT_MACRO_FILE="src/addons/input_macro.cpp"
          BOOTSEL_FILE="src/addons/bootsel_button.cpp"

          test -f "$INPUT_MACRO_FILE"
          test -f "$BOOTSEL_FILE"

          test "$(
            grep -c \
              "namespace Switch2FixSupport" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          test "$(
            grep -c \
              "readBootselButton" \
              "$INPUT_MACRO_FILE"
          )" -ge 2

          test "$(
            grep -c \
              "updateBootselMacroSelector" \
              "$INPUT_MACRO_FILE"
          )" -ge 2

          test "$(
            grep -c \
              "runAutomaticASequence" \
              "$INPUT_MACRO_FILE"
          )" -ge 2

          test "$(
            grep -c \
              "InputMacro::runCurrentMacro" \
              "$INPUT_MACRO_FILE"
          )" -eq 1

          grep -q \
            "restore_interrupts(flags)" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_6_INDEX = 5" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "MACRO_2_INDEX = 1" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_START_DELAY_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_INTERVAL_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "AUTO_A_HOLD_US" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "GAMEPAD_MASK_B1" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "macroPinMasks\[bootselMacroIndex\]" \
            "$INPUT_MACRO_FILE"

          grep -q \
            "bool BootselButtonAddon::available" \
            "$BOOTSEL_FILE"

          grep -q \
            "return false" \
            "$BOOTSEL_FILE"

          if grep -q \
            "restore_interrupts_from_disabled" \
            "$INPUT_MACRO_FILE"; then
            echo "Unsupported interrupt restore function found"
            exit 1
          fi

          if grep -q \
            "InputMacro trigger block not found" \
            "$INPUT_MACRO_FILE"; then
            echo "Old failed patch text found"
            exit 1
          fi

          echo "Patched source verification passed"

          echo
          echo "Patched checkMacroPress section:"
          grep \
            -n \
            -A 32 \
            -B 4 \
            "updateBootselMacroSelector" \
            "$INPUT_MACRO_FILE"

          echo
          echo "Patched preprocess section:"
          grep \
            -n \
            -A 24 \
            -B 4 \
            "runAutomaticASequence" \
            "$INPUT_MACRO_FILE"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"
          test -f lib/httpd/fsdata.c

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated Pico UF2
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t UF2_FILES < <(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | sort
          )

          if [ "${#UF2_FILES[@]}" -eq 0 ]; then
            echo "No UF2 files were generated"

            find gp2040-ce/build \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          printf '%s\n' "${UF2_FILES[@]}"

          UF2_FILE=""

          for candidate in "${UF2_FILES[@]}"; do
            candidate_name="$(
              basename "$candidate"
            )"

            if [[ "$candidate_name" == *Pico*.uf2 ]]; then
              UF2_FILE="$candidate"
              break
            fi
          done

          if [ -z "$UF2_FILE" ]; then
            UF2_FILE="${UF2_FILES[0]}"
          fi

          test -f "$UF2_FILE"

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Selected UF2:"
          echo "$UF2_FILE"

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

          OUTPUT_FILE="GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2"

          cp \
            "$UF2_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          sha256sum \
            "$OUTPUT_FILE" \
            > SHA256SUMS.txt

          echo "Firmware package created:"
          ls -lh \
            "$OUTPUT_FILE" \
            SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-v0.7.12-Switch2-Fix-AutoA
          path: |
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
