name: Build GP2040-CE v0.7.12 Switch 2 Fix Auto A

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify Pico SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          echo "Pico SDK found"

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify generated web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c

          echo "fsdata.c generated successfully"

      - name: Apply early Switch 2 fix and automatic A
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          macro_file = Path("src/addons/input_macro.cpp")
          macro_source = macro_file.read_text()

          required_includes = [
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
          ]

          gpio_include = '#include "hardware/gpio.h"'

          if gpio_include not in macro_source:
              raise SystemExit(
                  "Cannot find hardware/gpio.h include"
              )

          for include_line in required_includes:
              if include_line not in macro_source:
                  macro_source = macro_source.replace(
                      gpio_include,
                      gpio_include +
                      "\n" +
                      include_line,
                      1,
                  )

          helper_marker = (
              "namespace Switch2FixSupport"
          )

          helper_code = r'''
          namespace Switch2FixSupport {

          constexpr uint64_t BOOTSEL_START_DELAY_US =
              1000000;

          constexpr uint64_t BOOTSEL_POLL_INTERVAL_US =
              20000;

          constexpr uint64_t BOOTSEL_DEBOUNCE_US =
              30000;

          constexpr int MACRO_2_INDEX = 1;
          constexpr int MACRO_6_INDEX = 5;

          constexpr uint64_t AUTO_A_START_DELAY_US =
              1000000;

          constexpr uint64_t AUTO_A_INTERVAL_US =
              500000;

          constexpr uint64_t AUTO_A_HOLD_US =
              120000;

          constexpr int AUTO_A_PRESS_COUNT =
              3;

          uint64_t bootselStartTime = 0;
          uint64_t bootselLastPollTime = 0;
          uint64_t bootselChangedTime = 0;

          bool bootselRawState = false;
          bool bootselStableState = false;
          bool bootselEdgeState = false;

          int selectedMacro =
              MACRO_6_INDEX;

          uint64_t autoAStartTime = 0;
          int autoAPressCount = 0;

          bool __no_inline_not_in_flash_func(
              readBootselButton
          )() {
              const uint CS_PIN_INDEX = 1;

              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw->io[CS_PIN_INDEX].ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void updateBootselMacroSelector() {
              uint64_t now = getMicro();

              if (bootselStartTime == 0) {
                  bootselStartTime = now;
                  bootselChangedTime = now;
                  return;
              }

              // Do not access BOOTSEL immediately after
              // startup. This protects Switch 2 enumeration.
              if (
                  now - bootselStartTime <
                  BOOTSEL_START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - bootselLastPollTime <
                  BOOTSEL_POLL_INTERVAL_US
              ) {
                  return;
              }

              bootselLastPollTime = now;

              bool rawState =
                  readBootselButton();

              if (rawState != bootselRawState) {
                  bootselRawState = rawState;
                  bootselChangedTime = now;
              }

              if (
                  now - bootselChangedTime >=
                      BOOTSEL_DEBOUNCE_US &&
                  rawState != bootselStableState
              ) {
                  bootselStableState = rawState;

                  // Switch macro on the BOOTSEL press edge.
                  if (
                      bootselStableState &&
                      !bootselEdgeState
                  ) {
                      selectedMacro =
                          selectedMacro ==
                              MACRO_6_INDEX
                              ? MACRO_2_INDEX
                              : MACRO_6_INDEX;
                  }

                  bootselEdgeState =
                      bootselStableState;
              }
          }

          void runAutomaticASequence(
              Gamepad* gamepad
          ) {
              uint64_t now = getMicro();

              if (autoAStartTime == 0) {
                  autoAStartTime = now;
                  return;
              }

              if (
                  autoAPressCount >=
                  AUTO_A_PRESS_COUNT
              ) {
                  return;
              }

              uint64_t elapsed =
                  now - autoAStartTime;

              uint64_t pressStart =
                  AUTO_A_START_DELAY_US +
                  (
                      static_cast<uint64_t>(
                          autoAPressCount
                      ) *
                      AUTO_A_INTERVAL_US
                  );

              uint64_t pressEnd =
                  pressStart +
                  AUTO_A_HOLD_US;

              if (
                  elapsed >= pressStart &&
                  elapsed < pressEnd
              ) {
                  // B1 is the primary face button.
                  // In Switch mode it is normally A.
                  gamepad->state.buttons |=
                      GAMEPAD_MASK_B1;
              }

              if (elapsed >= pressEnd) {
                  autoAPressCount++;
              }
          }

          }
          '''

          if helper_marker not in macro_source:
              available_marker = (
                  "bool InputMacro::available()"
              )

              available_position = (
                  macro_source.find(
                      available_marker
                  )
              )

              if available_position < 0:
                  raise SystemExit(
                      "InputMacro::available not found"
                  )

              macro_source = (
                  macro_source[:available_position] +
                  helper_code.strip() +
                  "\n\n" +
                  macro_source[available_position:]
              )

          /*
           * Locate the macro trigger loop by structure,
           * not by exact indentation.
           */
          trigger_pattern = re.compile(
              r"""
              (?P<indent>[ \t]*)
              pressedMacro\s*=\s*-1\s*;
              (?P<newline>\r?\n)
              (?P<loopindent>[ \t]*)
              for\s*\(\s*int\s+i\s*=\s*0\s*;
              \s*i\s*<\s*MAX_MACRO_LIMIT\s*;
              \s*i\s*\+\+\s*\)\s*\{
              """,
              re.MULTILINE |
              re.VERBOSE,
          )

          trigger_match = trigger_pattern.search(
              macro_source
          )

          if trigger_match is None:
              raise SystemExit(
                  "Could not locate InputMacro macro trigger loop"
              )

          trigger_indent = trigger_match.group(
              "indent"
          )

          loop_indent = trigger_match.group(
              "loopindent"
          )

          selector_block = f"""
          {trigger_indent}Switch2FixSupport::updateBootselMacroSelector();

          {trigger_indent}// BOOTSEL selects Macro 2 or Macro 6.
          {trigger_indent}// Reuse the normal InputMacro path.
          {trigger_indent}if (
          {trigger_indent}    macroPinMasks[Switch2FixSupport::MACRO_2_INDEX] &&
          {trigger_indent}    macroPinMasks[Switch2FixSupport::MACRO_6_INDEX] &&
          {trigger_indent}    (
          {trigger_indent}        allPins &
          {trigger_indent}        macroPinMasks[Switch2FixSupport::MACRO_2_INDEX]
          {trigger_indent}    )
          {trigger_indent}) {{
          {trigger_indent}    pressedMacro =
          {trigger_indent}        Switch2FixSupport::selectedMacro;
          {trigger_indent}    return;
          {trigger_indent}}}

          {trigger_indent}pressedMacro = -1;
          {loop_indent}for(int i = 0; i < MAX_MACRO_LIMIT; i++) {{
          """

          macro_source = (
              macro_source[:trigger_match.start()] +
              selector_block +
              macro_source[trigger_match.end():]
          )

          /*
           * Add automatic A call at the beginning of
           * InputMacro::preprocess(), tolerating spaces
           * and CRLF/LF line endings.
           */
          preprocess_pattern = re.compile(
              r"""
              void\s+InputMacro::preprocess\s*\(\s*\)
              \s*\{
              """,
              re.MULTILINE |
              re.VERBOSE,
          )

          preprocess_match = preprocess_pattern.search(
              macro_source
          )

          if preprocess_match is None:
              raise SystemExit(
                  "InputMacro::preprocess not found"
              )

          auto_a_call = r"""

          {
              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              Switch2FixSupport::runAutomaticASequence(
                  gamepad
              );
          }

          """

          macro_source = (
              macro_source[:preprocess_match.end()] +
              auto_a_call +
              macro_source[preprocess_match.end():]
          )

          macro_file.write_text(macro_source)

          /*
           * Disable the original BOOTSEL addon.
           * BOOTSEL handling is now inside input_macro.cpp,
           * matching the early Switch 2 Fix architecture.
           */
          bootsel_file = Path(
              "src/addons/bootsel_button.cpp"
          )

          bootsel_file.write_text(
              '#include "addons/bootsel_button.h"\n\n'
              'bool BootselButtonAddon::available() '
              '{ return false; }\n'
              'void BootselButtonAddon::setup() {}\n'
              'void BootselButtonAddon::preprocess() {}\n'
          )

          print(
              "Early Switch 2 Fix architecture installed"
          )
          print(
              "Regex-based macro trigger patch applied"
          )
          print(
              "BOOTSEL polling starts after one second"
          )
          print(
              "BOOTSEL polling interval: 20 ms"
          )
          print(
              "BOOTSEL debounce interval: 30 ms"
          )
          print(
              "Automatic A presses: 3"
          )
          print(
              "Automatic A interval: 500 ms"
          )
          PY

      - name: Verify patched source
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/input_macro.cpp
          test -f src/addons/bootsel_button.cpp

          grep -q \
            "namespace Switch2FixSupport" \
            src/addons/input_macro.cpp

          grep -q \
            "readBootselButton" \
            src/addons/input_macro.cpp

          grep -q \
            "updateBootselMacroSelector" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_PRESS_COUNT" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_INTERVAL_US" \
            src/addons/input_macro.cpp

          grep -q \
            "AUTO_A_HOLD_US" \
            src/addons/input_macro.cpp

          grep -q \
            "GAMEPAD_MASK_B1" \
            src/addons/input_macro.cpp

          grep -q \
            "InputMacro::runCurrentMacro" \
            src/addons/input_macro.cpp

          grep -q \
            "return false" \
            src/addons/bootsel_button.cpp

          if grep -q \
            "InputMacro trigger block not found" \
            src/addons/input_macro.cpp; then
            echo "Old failed patch text was written into source"
            exit 1
          fi

          echo "Patched source verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/pico-sdk"
          test -f "$GITHUB_WORKSPACE/pico-sdk/pico_sdk_init.cmake"

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico
          export SKIP_WEBBUILD=TRUE

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Find generated UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -maxdepth 3 \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "Pico UF2 file was not generated"

            find gp2040-ce/build \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1
          fi

          echo "UF2_FILE=$UF2_FILE" \
            >> "$GITHUB_ENV"

          echo "Generated UF2:"
          echo "$UF2_FILE"

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UF2_FILE:-}"
          test -f "$UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2

          sha256sum \
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2 \
            > SHA256SUMS.txt

          echo "Firmware package created"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-v0.7.12-Switch2-Fix-AutoA
          path: |
            GP2040-CE-v0.7.12-Switch2-Fix-AutoA.uf2
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
