def find_function_span(
              text,
              function_name,
          ):
              pattern = re.compile(
                  r"^[ \t]*"
                  r"(?:bool|void|int|uint|uint32_t|"
                  r"uint64_t|std::string)"
                  r"[ \t]+"
                  + re.escape(function_name)
                  + r"[ \t]*"
                  r"\([ \t\r\n]*\)",
                  re.MULTILINE,
              )

              matches = list(
                  pattern.finditer(text)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "Expected exactly one "
                      + function_name
                      + ", found "
                      + str(len(matches))
                  )

              match = matches[0]

              opening_brace = text.find(
                  "{",
                  match.end(),
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Opening brace for "
                      + function_name
                      + " was not found"
                  )

              depth = 0
              closing_brace = -1

              for position in range(
                  opening_brace,
                  len(text),
              ):
                  character = text[position]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          closing_brace = position
                          break

              if closing_brace < 0:
                  raise SystemExit(
                      "Closing brace for "
                      + function_name
                      + " was not found"
                  )

              return (
                  match.start(),
                  closing_brace + 1,
              )
