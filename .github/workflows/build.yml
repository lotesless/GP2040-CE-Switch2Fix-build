name: Build GP2040-CE BOOTSEL Macro 2-6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPSTREAM_REF: v0.7.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout official GP2040-CE source
        uses: actions/checkout@v4
        with:
          repository: OpenStickCommunity/GP2040-CE
          ref: ${{ env.UPSTREAM_REF }}
          path: gp2040-ce
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: gp2040-ce/www/package-lock.json

      - name: Setup Raspberry Pi Pico SDK
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Build web assets
        working-directory: gp2040-ce/www
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          CI=false npm run build

      - name: Verify web filesystem
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/httpd/fsdata.c
          echo "fsdata.c generated successfully"

      - name: Apply BOOTSEL macro bridge patch
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/addons/bootsel_button.cpp")
          source = path.read_text()

          include_anchor = '#include "addons/bootsel_button.h"'

          required_includes = [
              '#include "storagemanager.h"',
              '#include "hardware/sync.h"',
              '#include "hardware/structs/ioqspi.h"',
              '#include "hardware/structs/sio.h"',
              '#include "helper.h"',
              '#include "config.pb.h"',
          ]

          if include_anchor not in source:
              raise SystemExit(
                  "Cannot find BOOTSEL include anchor"
              )

          for include_line in required_includes:
              if include_line not in source:
                  source = source.replace(
                      include_anchor,
                      include_anchor + "\n" + include_line,
                      1,
                  )

          namespace_marker = (
              "namespace BootselMacroBridge"
          )

          namespace_code = r'''
          namespace BootselMacroBridge {

          constexpr uint32_t MACRO_2_GPIO_MASK =
              1u << 6;

          constexpr uint32_t MACRO_6_GPIO_MASK =
              1u << 7;

          constexpr uint64_t START_DELAY_US =
              1000000;

          constexpr uint64_t POLL_INTERVAL_US =
              50000;

          constexpr uint64_t DEBOUNCE_US =
              30000;

          uint64_t startedAt = 0;
          uint64_t lastPollAt = 0;
          uint64_t changedAt = 0;

          bool rawPressed = false;
          bool stablePressed = false;

          // The first BOOTSEL press runs Macro 6.
          uint32_t activeMacroMask =
              MACRO_6_GPIO_MASK;

          bool __no_inline_not_in_flash_func(
              readBootselForMacro
          )() {
              const uint CS_PIN_INDEX = 1;

              // BOOTSEL is connected to the RP2040
              // QSPI chip-select pin.
              uint32_t flags =
                  save_and_disable_interrupts();

              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_LOW
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              // Do not call flash-resident functions
              // while QSPI chip select is overridden.
              for (volatile int i = 0; i < 1000; ++i) {
                  __asm volatile("nop");
              }

              // BOOTSEL is active low.
              bool pressed =
                  !(sio_hw->gpio_hi_in &
                    (1u << CS_PIN_INDEX));

              hw_write_masked(
                  &ioqspi_hw
                      ->io[CS_PIN_INDEX]
                      .ctrl,
                  GPIO_OVERRIDE_NORMAL
                      << IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_LSB,
                  IO_QSPI_GPIO_QSPI_SS_CTRL_OEOVER_BITS
              );

              restore_interrupts(flags);

              return pressed;
          }

          void update() {
              uint64_t now = getMicro();

              if (startedAt == 0) {
                  startedAt = now;
                  changedAt = now;
                  return;
              }

              // Do not access BOOTSEL during startup.
              if (
                  now - startedAt <
                  START_DELAY_US
              ) {
                  return;
              }

              if (
                  now - lastPollAt <
                  POLL_INTERVAL_US
              ) {
                  return;
              }

              lastPollAt = now;

              bool currentRaw =
                  readBootselForMacro();

              if (currentRaw != rawPressed) {
                  rawPressed = currentRaw;
                  changedAt = now;
              }

              if (
                  now - changedAt >=
                      DEBOUNCE_US &&
                  rawPressed != stablePressed
              ) {
                  stablePressed = rawPressed;

                  // Switch the selected macro only after
                  // the button has been released.
                  //
                  // This guarantees:
                  // first press  = Macro 6
                  // second press = Macro 2
                  if (!stablePressed) {
                      if (
                          activeMacroMask ==
                          MACRO_6_GPIO_MASK
                      ) {
                          activeMacroMask =
                              MACRO_2_GPIO_MASK;
                      } else {
                          activeMacroMask =
                              MACRO_6_GPIO_MASK;
                      }
                  }
              }
          }

          void applyVirtualMacroPin(
              Gamepad* gamepad
          ) {
              const uint32_t bothMacroMasks =
                  MACRO_2_GPIO_MASK |
                  MACRO_6_GPIO_MASK;

              // GP6 and GP7 are virtual macro inputs.
              // Remove their physical GPIO states first.
              //
              // This makes GP6 and GP7 safe to leave
              // disconnected or permanently grounded.
              gamepad->debouncedGpio &=
                  ~bothMacroMasks;

              // While BOOTSEL is stably pressed,
              // expose exactly one virtual macro pin.
              if (stablePressed) {
                  gamepad->debouncedGpio |=
                      activeMacroMask;
              }
          }

          }
          '''

          if namespace_marker not in source:
              source = source.replace(
                  include_anchor,
                  include_anchor +
                  "\n" +
                  namespace_code,
                  1,
              )

          def replace_function(
              text,
              signature,
              replacement
          ):
              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Cannot find function: " +
                      signature
                  )

              opening_brace = text.find(
                  "{",
                  start,
              )

              if opening_brace < 0:
                  raise SystemExit(
                      "Cannot find opening brace: " +
                      signature
                  )

              depth = 0
              end = -1

              for index in range(
                  opening_brace,
                  len(text),
              ):
                  character = text[index]

                  if character == "{":
                      depth += 1

                  elif character == "}":
                      depth -= 1

                      if depth == 0:
                          end = index + 1
                          break

              if end < 0:
                  raise SystemExit(
                      "Cannot find closing brace: " +
                      signature
                  )

              return (
                  text[:start] +
                  replacement +
                  text[end:]
              )

          new_available = r'''
          bool BootselButtonAddon::available() {
              // Always load this addon because it is also
              // used as the BOOTSEL-to-macro bridge.
              return true;
          }
          '''

          new_setup = r'''
          void BootselButtonAddon::setup() {
              const BootselButtonOptions& options =
                  Storage::getInstance()
                      .getAddonOptions()
                      .bootselButtonOptions;

              // Preserve the official BOOTSEL button
              // configuration if one exists.
              bootselButtonMap =
                  options.buttonMap;
          }
          '''

          new_preprocess = r'''
          void BootselButtonAddon::preprocess() {
              Gamepad* gamepad =
                  Storage::getInstance()
                      .GetGamepad();

              BootselMacroBridge::update();

              // Preserve the official BOOTSEL button
              // behavior when a button map is configured.
              if (
                  BootselMacroBridge::stablePressed &&
                  bootselButtonMap != 0
              ) {
                  switch (bootselButtonMap) {
                      case GAMEPAD_MASK_DU:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_UP;
                          break;

                      case GAMEPAD_MASK_DD:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_DOWN;
                          break;

                      case GAMEPAD_MASK_DL:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_LEFT;
                          break;

                      case GAMEPAD_MASK_DR:
                          gamepad->state.dpad |=
                              GAMEPAD_MASK_RIGHT;
                          break;

                      default:
                          gamepad->state.buttons |=
                              bootselButtonMap;
                          break;
                  }
              }

              // Expose BOOTSEL as one virtual macro GPIO.
              //
              // The official InputMacro addon will process
              // this through its normal implementation.
              BootselMacroBridge::applyVirtualMacroPin(
                  gamepad
              );
          }
          '''

          source = replace_function(
              source,
              "bool BootselButtonAddon::available()",
              new_available,
          )

          source = replace_function(
              source,
              "void BootselButtonAddon::setup()",
              new_setup,
          )

          source = replace_function(
              source,
              "void BootselButtonAddon::preprocess()",
              new_preprocess,
          )

          path.write_text(source)

          print(
              "BOOTSEL macro bridge patch applied"
          )
          print(
              "Official input_macro.cpp unchanged"
          )
          print(
              "Official runCurrentMacro() unchanged"
          )
          print(
              "First press selects Macro 6"
          )
          print(
              "Second press selects Macro 2"
          )
          print(
              "GP6 and GP7 physical states are ignored"
          )
          PY

      - name: Verify BOOTSEL macro bridge
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          test -f src/addons/bootsel_button.cpp

          grep -q "namespace BootselMacroBridge" \
            src/addons/bootsel_button.cpp

          grep -q "MACRO_2_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q "MACRO_6_GPIO_MASK" \
            src/addons/bootsel_button.cpp

          grep -q "readBootselForMacro" \
            src/addons/bootsel_button.cpp

          grep -q "applyVirtualMacroPin" \
            src/addons/bootsel_button.cpp

          grep -q "return true" \
            src/addons/bootsel_button.cpp

          test -f src/addons/input_macro.cpp

          echo "BOOTSEL macro bridge verification passed"

      - name: Configure Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          export GP2040_BOARDCONFIG=Pico

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico firmware
        working-directory: gp2040-ce
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Package UF2
        shell: bash
        run: |
          set -euo pipefail

          UF2_FILE="$(
            find gp2040-ce/build \
              -type f \
              -name "*.uf2" \
              | head -n 1
          )"

          if [ -z "$UF2_FILE" ]; then
            echo "No UF2 file was generated"
            find gp2040-ce/build \
              -type f \
              | sort
            exit 1
          fi

          echo "Generated UF2: $UF2_FILE"

          cp \
            "$UF2_FILE" \
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2

          sha256sum \
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2 \
            > SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6
          path: |
            GP2040-CE-Pico-BOOTSEL-Bridge-Macro2-Macro6.uf2
            SHA256SUMS.txt
          if-no-files-found: error
